# Minimal Supabase CLI config for the Lumen backend (free tier). `project_id` is a local label only.
project_id = "lumen-backend"

[auth]
enable_anonymous_sign_ins = true   # also enable in Dashboard > Authentication > Sign In / Providers

[functions.answer]
verify_jwt = true                  # gateway rejects calls without a valid user/anon JWT; code re-verifies

[functions.voices]
verify_jwt = true

[functions.tts]
verify_jwt = true

[functions.stt-token]
verify_jwt = true

[functions.memory]
verify_jwt = true                  # D80 memory extraction, user JWT

[functions.study-cards]
verify_jwt = true                  # D81 study cards, user JWT

[functions.study-profile]
verify_jwt = true                  # D84 spoken study profile + term list

[functions.exam]
verify_jwt = true                  # D84 exam session (parse, hint, grade, summary)

[functions.study-plan]
verify_jwt = true                  # K17 spaced repetition + plan up to the exam (code only, user JWT)

[functions.provlage-eval]
verify_jwt = true                  # D87 Provläge test bank (answers + grading, capped)

[functions.qa-log]
verify_jwt = true                  # K30 Aron's question-and-answer log (owner email + email sign-in only)

[functions.my-answers]
verify_jwt = true                  # K37 Mina svar: suggest, proofread, compress (user JWT, nothing stored)

[functions.logo-vote]
verify_jwt = true                  # K39 logo vote (own vote; ?view=owner for Aron only)

[functions.real-users-admin]
verify_jwt = true                  # K38 Aron's review of the K22 candidates (owner email + email sign-in only)

[functions.connect]
verify_jwt = false                 # K36 OAuth: Spotify's redirect has no JWT; the handler verifies the JWT on every other route

[functions.voice-lab]
verify_jwt = false                 # K6 voice design previews, does its own strict service-role check

[functions.usage-stats]
verify_jwt = false                 # does its own strict service-role check (new sb_secret keys are not JWTs)
