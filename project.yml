# XcodeGen spec (D9). Generate with: xcodegen generate
# Lumen.xcodeproj is NOT committed (D14); CI regenerates it and uploads it as an artifact.
name: Lumen
options:
  bundleIdPrefix: com.rsolutions
  # Kelly (A93): system labels in Swedish (PasteButton "Klistra in", Tillbaka, Klar, Sök); the app is Swedish only.
  developmentLanguage: sv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  LumenScoring:
    path: Packages/LumenScoring
  # D78 / OSS-2: Silero VAD. The local package pins FluidAudio and switches its TTS/diarizer/Nemo traits off.
  LumenVAD:
    path: Packages/LumenVAD
  # A6.3: Spotify App Remote (binary xcframework, Spotify Developer Terms). Inert without SPOTIFY_CLIENT_ID.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    # Signing: leave the team empty in the repo. Set it locally in Xcode
    # (target Lumen -> Signing & Capabilities -> Team); see docs/DEVICE-TEST-CHECKLIST.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    dependencies:
      - package: LumenScoring
      - package: LumenVAD
      - package: SpotifyiOS
      - target: LumenControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen
        # A44: the app group the home screen widget reads its snapshot from (CI builds unsigned and ignores it).
        CODE_SIGN_ENTITLEMENTS: Entitlements/Lumen.entitlements
        # A6.3: empty in the repo. CI passes the repository secret SPOTIFY_CLIENT_ID (a public identifier, not a key).
        SPOTIFY_CLIENT_ID: ""
        PRODUCT_NAME: Lumen
        INFOPLIST_FILE: Lumen/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # A71 (D129): the app had no icon at all; glasklotet (D) from the asset catalog until Kelly's Ke40 files land.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ke53 point 5 (A87): the accent blue for every system control.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          # Debug only (Phase 1 assignment 3.3): exposes exported WAV files in the Files app / Finder.
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # Live Activity + Control (D33). Shared/ is compiled into both targets.
  LumenControls:
    type: app-extension
    platform: iOS
    sources:
      - path: LumenControls
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.controls
        CODE_SIGN_ENTITLEMENTS: Entitlements/LumenControls.entitlements # A44
        PRODUCT_NAME: LumenControls
        INFOPLIST_FILE: LumenControls/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenTests
      # A96/K60: the import cases Kevin's import_text test reads too.
      - path: testdata/import/o58-cases.json
        buildPhase: resources
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.tests
        GENERATE_INFOPLIST_FILE: YES

  # A1: Toby's end-to-end tests (WAV files through the real chain in the Simulator). Its own scheme, so they never run
  # on an ordinary push (they reach the live Scribe and /answer); run by hand or nightly.
  LumenE2ETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests/E2E
        excludes:
          - "**/*.md"
          - "Audio/**"
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.e2etests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumenTests
  # A1: `xcodebuild test -scheme LumenE2E …` (Toby). Not in the push workflow.
  LumenE2E:
    build:
      targets:
        Lumen: all
        LumenE2ETests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumenE2ETests
