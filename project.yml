# XcodeGen spec (D9). Generate with: xcodegen generate
# Lumen.xcodeproj is NOT committed (D14); CI regenerates it and uploads it as an artifact.
name: Lumen
options:
  bundleIdPrefix: com.rsolutions
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  LumenScoring:
    path: Packages/LumenScoring
  # D78 / OSS-2: Silero VAD. The local package pins FluidAudio and switches its TTS/diarizer/Nemo traits off.
  LumenVAD:
    path: Packages/LumenVAD

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    # Signing: leave the team empty in the repo. Set it locally in Xcode
    # (target Lumen -> Signing & Capabilities -> Team); see docs/DEVICE-TEST-CHECKLIST.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    dependencies:
      - package: LumenScoring
      - package: LumenVAD
      - target: LumenControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen
        PRODUCT_NAME: Lumen
        INFOPLIST_FILE: Lumen/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          # Debug only (Phase 1 assignment 3.3): exposes exported WAV files in the Files app / Finder.
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # Live Activity + Control (D33). Shared/ is compiled into both targets.
  LumenControls:
    type: app-extension
    platform: iOS
    sources:
      - path: LumenControls
        excludes:
          - "Info.plist"
      - path: Shared
      # D86: the app's font on the lock screen too.
      - path: Lumen/Resources/Fonts/FamiljenGrotesk.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.controls
        PRODUCT_NAME: LumenControls
        INFOPLIST_FILE: LumenControls/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenTests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.tests
        GENERATE_INFOPLIST_FILE: YES

  # A1: Toby's end-to-end tests (WAV files through the real chain in the Simulator). Its own scheme, so they never run
  # on an ordinary push (they reach the live Scribe and /answer); run by hand or nightly.
  LumenE2ETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests/E2E
        excludes:
          - "**/*.md"
          - "Audio/**"
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsolutions.lumen.e2etests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumenTests
  # A1: `xcodebuild test -scheme LumenE2E …` (Toby). Not in the push workflow.
  LumenE2E:
    build:
      targets:
        Lumen: all
        LumenE2ETests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LumenE2ETests
