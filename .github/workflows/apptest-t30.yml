name: Apptest T30 (streak and reminder)

# Toby (moln): T30 (D194) in the Simulator: streak and the reminder question after the first exam. Fake audio (D180).
# x-earmind-test through LUMEN_TEST_HEADER). The runner's network services are turned off for a few minutes while the
# test plays (watchdog 9 min). Makes one test exam and removes it again. Manual, and on Toby's branch when the test
# changes. Simulator only: never a device test.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Screens/ReminderFlowTests.swift"
      - "scripts/apptest/t30.sh"
      - ".github/workflows/apptest-t30.yml"

concurrency:
  group: apptest-t30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t30:
    name: T30 (Simulator, fake audio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: T30
        run: |
          bash scripts/apptest/t30.sh
          STATUS=$?
          cat apptest-out/t30/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-t30
          path: |
            apptest-out/t30
            !apptest-out/t30/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
