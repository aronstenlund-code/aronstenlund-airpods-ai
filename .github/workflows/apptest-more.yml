name: Apptest more window (T7)

# Toby's T7: Angela's A15 'Mer?' window through the app's real chain in the Simulator (ja, mer, gärna, a late ja,
# ja inside a sentence, another voice, a new question). Live and paid (Scribe, /answer; Apple's voice, no /tts), so
# manual, and on Toby's branch when the test changes. Simulator only: never a device test. D120: the speech is
# macOS `say` (free); Scribe is open about 30 s per case, 8 cases. Run once per fix, not on every push.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/More/**"
      - "AppTests/E2E/Audio/more.tsv"
      - "scripts/apptest/more*"
      - ".github/workflows/apptest-more.yml"

concurrency:
  group: apptest-more-${{ github.ref }}
  cancel-in-progress: true

jobs:
  more:
    name: T7 more window (Simulator, live)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # T17c (Toby 1, D180, owner): testing never uses ElevenLabs credits. This test listens through Scribe, so it is
      # off; the listening is tested with recorded transcripts in apptest-transcript.yml. A run that needs Scribe
      # requires Aron's yes in chat first, and then a session turns this step off for that one run.
      - name: Off (D180, no ElevenLabs credits for tests)
        run: |
          echo "::error::Off since 2026-11-14 (D180): testing never uses ElevenLabs credits. Use apptest-transcript.yml, or ask Aron first."
          exit 1
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Retest
        run: |
          bash scripts/apptest/more.sh
          STATUS=$?
          cat apptest-out/more/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-more
          path: |
            apptest-out/more
            !apptest-out/more/audio/*.wav
            !apptest-out/more/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
