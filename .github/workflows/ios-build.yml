name: iOS build

on:
  push:
    # Deangelo 2026-11-18 (D235): Kelly's and Oscar's session branches only merge main into themselves; building them
    # again takes macOS machines from main and the app branches.
    branches-ignore:
      - "claude/eager-tesla-9u6jyi"
      - "claude/nice-ptolemy-4tsvw7"
    # Docs-, backend-, site- and QA-script-only pushes (Architect/Deangelo/Kevin/Kelly/Oscar) must not trigger or cancel an iOS build.
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "prompts/**"
      - "testdata/**"
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      # Angela 2026-11-11: backend deploys and QA/eval workflows never change the app (Kevin's K37/K39/K36 pushes
      # cancelled four app builds in a row).
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/nightly-eval.yml"
      - ".github/workflows/real-users.yml"
      - ".github/workflows/reported-cases.yml"
      - ".github/workflows/auth-rate-limit.yml"
      - ".github/workflows/credits-ready.yml"
      - ".github/workflows/audio-eval.yml"
      - ".github/workflows/oscar-ab-audio.yml"
      # Deangelo 2026-11-16: live-test and check workflows of Kevin, Oscar and Kelly cancelled six app builds in a row
      # (A112b never got a green build on main). They never change the app.
      - ".github/workflows/kevin-*.yml"
      - ".github/workflows/oscar-*.yml"
      - ".github/workflows/kelly-*.yml"
      - ".github/workflows/storage-report.yml"
      - ".github/workflows/testmode-check.yml"
      - "AppTests/**"
      - ".github/workflows/apptest-*.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "prompts/**"
      - "testdata/**"
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      # Angela 2026-11-11: backend deploys and QA/eval workflows never change the app (Kevin's K37/K39/K36 pushes
      # cancelled four app builds in a row).
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/nightly-eval.yml"
      - ".github/workflows/real-users.yml"
      - ".github/workflows/reported-cases.yml"
      - ".github/workflows/auth-rate-limit.yml"
      - ".github/workflows/credits-ready.yml"
      - ".github/workflows/audio-eval.yml"
      - ".github/workflows/oscar-ab-audio.yml"
      # Deangelo 2026-11-16: live-test and check workflows of Kevin, Oscar and Kelly cancelled six app builds in a row
      # (A112b never got a green build on main). They never change the app.
      - ".github/workflows/kevin-*.yml"
      - ".github/workflows/oscar-*.yml"
      - ".github/workflows/kelly-*.yml"
      - ".github/workflows/storage-report.yml"
      - ".github/workflows/testmode-check.yml"
      - "AppTests/**"
      - ".github/workflows/apptest-*.yml"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  # Deangelo 2026-11-13 (D167): on main a running build always finishes (two app builders pushed so often that
  # every build was cancelled and Aron got no ipa for an hour). GitHub keeps only the newest waiting run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build (iOS 26) + unit tests
    # Phase 1a 3.1: macOS 26 image with Xcode 26.x (actions/runner-images "macos-26").
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 and print toolchain
        run: |
          set -euo pipefail
          # Newest Xcode 26.x present on the image (path taken from the image, not guessed).
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "::group::sw_vers"; sw_vers; echo "::endgroup::"
          echo "::group::xcodebuild -version"; xcodebuild -version; echo "::endgroup::"
          echo "::group::swift --version"; swift --version; echo "::endgroup::"
          echo "::group::xcodebuild -showsdks"; xcodebuild -showsdks; echo "::endgroup::"

      - name: API-name check against the iOS SDK (replaces the local header check)
        run: bash tools/ci/check-sdk-symbols.sh

      - name: Dump Speech (SpeechAnalyzer) API from the SDK (reading aid, item 2)
        run: bash tools/ci/dump-speech-api.sh

      - name: Install XcodeGen and generate project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcodegen generate
          ls -la Lumen.xcodeproj

      # A152 (D238): every "required reason API" the code uses has its reason in the target's PrivacyInfo.xcprivacy,
      # and nothing is declared that the code does not use.
      - name: Privacy manifests match the code (A152)
        run: python3 scripts/privacy_manifest_check.py

      - name: Scoring package tests (macOS host, swift test)
        run: |
          set -euo pipefail
          mkdir -p build-logs
          swift test --package-path Packages/LumenScoring 2>&1 | tee build-logs/scoring-tests.log

      - name: Build app for iOS device (unsigned; warnings are errors in our targets via project.yml)
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-logs/xcodebuild-build.log | xcbeautify --renderer github-actions
          # D78: FluidAudio's TTS data is GPL-3.0 / CC-BY-SA. LumenVAD switches those traits off; prove nothing slipped in.
          APP="DerivedData/Build/Products/Debug-iphoneos/Lumen.app"
          FOUND="$(find "$APP" \( -iname "*luxtts*" -o -iname "*NemoTextProcessing*" -o -iname "*kokoro*" -o -iname "*lexicon*" \) || true)"
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "::error::FluidAudio TTS/Nemo resources are in the app bundle (licence rule, D78)"
            exit 1
          fi
          echo "Licence check: no FluidAudio TTS or Nemo resources in the bundle"

      - name: Pick an iOS 26 iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          echo "::group::Available simulators"; xcrun simctl list devices available; echo "::endgroup::"
          JSON="$(xcrun simctl list devices available -j)"
          # Newest iOS 26 runtime, then prefer iPhone 17 / 17 Pro / Air, else any iPhone.
          RUNTIME="$(echo "$JSON" | jq -r '.devices | keys[] | select(test("iOS-26"))' | sort -V | tail -n 1)"
          echo "Runtime: $RUNTIME"
          UDID="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" '.devices[$rt][] | select(.name | test("^iPhone 17$|^iPhone 17 Pro$|^iPhone Air$")) | .udid' | head -n 1)"
          if [ -z "$UDID" ]; then
            UDID="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" '.devices[$rt][] | select(.name | test("^iPhone")) | .udid' | head -n 1)"
          fi
          test -n "$UDID" || { echo "No iOS 26 iPhone simulator found"; exit 1; }
          NAME="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" --arg id "$UDID" '.devices[$rt][] | select(.udid == $id) | .name')"
          echo "Using simulator: $NAME ($UDID) on $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Unit tests (LumenTests on iOS 26 Simulator)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath build-logs/LumenTests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-test.log | xcbeautify --renderer github-actions

      # A142 (D218 point 4, D227): the App Store build (Release) must compile and must not contain the test mode, which
      # sends the microphone's audio to us (D140). The test mode is compiled only with LUMEN_TESTMODE (Debug and Beta).
      # The Debug build from the step above is the control: the same search must find the test mode there, or the
      # search itself is broken.
      - name: Release build has no test mode (A142)
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-logs/xcodebuild-release.log | xcbeautify --renderer github-actions
          RELEASE="DerivedData-release/Build/Products/Release-iphoneos/Lumen.app"
          DEBUG="DerivedData/Build/Products/Debug-iphoneos/Lumen.app"
          test -d "$RELEASE" && test -d "$DEBUG"
          # The server address of the test mode and the types that keep and send the audio.
          MARKS='functions/v1/debug-audio|DebugAudioWriter|DebugAudioClient|DebugPieceStore|DebugAudioController|DebugTurnBody'
          IN_DEBUG="$(LC_ALL=C grep -rlaE "$MARKS" "$DEBUG" || true)"
          if [ -z "$IN_DEBUG" ]; then
            echo "::error::The control failed: the test mode was not found in the Debug build, so the search proves nothing"
            exit 1
          fi
          echo "Control: the test mode is in the Debug build ($(echo "$IN_DEBUG" | wc -l | tr -d ' ') files)"
          IN_RELEASE="$(LC_ALL=C grep -rlaE "$MARKS" "$RELEASE" || true)"
          if [ -n "$IN_RELEASE" ]; then
            echo "$IN_RELEASE"
            echo "::error::The test mode (D140) is in the Release build. It may only be in Debug and Beta (A142, D227)"
            exit 1
          fi
          echo "Release check: no test mode in the Release build"

      # A152 (D238): the manifests are in the app that would go to the App Store, unchanged, and the log says which
      # packages bring their own (information: a package without one is not our file to write).
      - name: Privacy manifests are in the Release app (A152)
        run: |
          set -euo pipefail
          RELEASE="DerivedData-release/Build/Products/Release-iphoneos/Lumen.app"
          check() { # built file, source file
            if [ ! -f "$1" ]; then
              echo "::error::$1 is missing: the privacy manifest is not in the Release app (A152)"
              exit 1
            fi
            plutil -lint "$1"
            if ! python3 -c 'import plistlib, sys; a, b = (plistlib.load(open(p, "rb")) for p in sys.argv[1:3]); sys.exit(0 if a == b else 1)' "$1" "$2"; then
              echo "::error::$1 is not the same as $2"
              exit 1
            fi
            echo "In the Release app, same as the source: $1"
          }
          check "$RELEASE/PrivacyInfo.xcprivacy" Lumen/Resources/PrivacyInfo.xcprivacy
          check "$RELEASE/PlugIns/LumenControls.appex/PrivacyInfo.xcprivacy" LumenControls/PrivacyInfo.xcprivacy
          plutil -p "$RELEASE/PrivacyInfo.xcprivacy"
          echo "== Every privacy manifest in the Release app"
          find "$RELEASE" -name PrivacyInfo.xcprivacy | sed 's/^/  /'
          echo "== Frameworks and bundles in the Release app"
          find "$RELEASE" -maxdepth 3 \( -name "*.framework" -o -name "*.bundle" -o -name "*.appex" \) | sed 's/^/  /'
          APIS='NSUserDefaults|UserDefaults|mach_absolute_time|systemUptime|contentModificationDate|ModificationDateKey|creationDateKey|fileModificationDate|volumeAvailableCapacity|systemFreeSize|systemSize|statfs|statvfs|activeInputModes'
          echo "== Packages (source): their own manifest, and required reason APIs in their code"
          for PKG in DerivedData-release/SourcePackages/checkouts/*; do
            [ -d "$PKG" ] || continue
            echo "-- $(basename "$PKG")"
            find "$PKG" -name PrivacyInfo.xcprivacy | sed 's/^/   manifest: /'
            # The lines themselves, so the log says which API it is. Only what is compiled into the app: not the
            # package's tests, examples and demo projects.
            (grep -rEn "$APIS" "$PKG" --include='*.swift' --include='*.m' --include='*.mm' --include='*.c' --include='*.cpp' --include='*.h' 2>/dev/null \
              | grep -vE '/Tests/|/Examples/|/DemoProjects/|\.xcframework/' | head -25 | cut -c1-260 | sed 's/^/   uses: /') || true
          done
          echo "== Packages (binary): their own manifest, and required reason APIs in the binary"
          find DerivedData-release/SourcePackages/artifacts -name "*.xcframework" 2>/dev/null | while read -r FW; do
            echo "-- $FW"
            find "$FW" -name PrivacyInfo.xcprivacy | sed 's/^/   manifest: /'
            find "$FW" -path "*ios-arm64*" -type f -perm +111 ! -name "*.plist" 2>/dev/null | head -3 | while read -r BIN; do
              echo "   binary: $BIN"
              (strings -a "$BIN" | grep -E "$APIS" | sort -u | head -20 | sed 's/^/     /') || true
            done || true
          done || true

      # A142: the build for TestFlight and our testers (Beta) on request: it must compile and must have the test mode.
      - name: Beta build has the test mode (A142, manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Beta \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-beta \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-logs/xcodebuild-beta.log | xcbeautify --renderer github-actions
          BETA="DerivedData-beta/Build/Products/Beta-iphoneos/Lumen.app"
          test -d "$BETA"
          LC_ALL=C grep -rlaE 'functions/v1/debug-audio' "$BETA" >/dev/null || {
            echo "::error::The test mode is missing from the Beta build (A142, D227)"; exit 1; }
          echo "Beta check: the test mode is in the Beta build"

      # D70: an unsigned .ipa the owner installs with Sideloadly (Windows, free Apple ID). Only after every step above
      # is green, and only for main or a manual run. Debug configuration: Diagnostics and the WAV export stay in.
      - name: Archive unsigned app and pack Lumen-unsigned.ipa (D70)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          # A6.3: Spotify's Client ID (a public identifier). Empty until Aron adds the repository secret.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild archive \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lumen.xcarchive \
            -derivedDataPath DerivedData-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_DEBUG_DYLIB=NO \
            SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_ID}" \
            LUMEN_GIT_SHA="${GITHUB_SHA::7}" \
            2>&1 | tee build-logs/xcodebuild-archive.log | xcbeautify --renderer github-actions
          APP=build/Lumen.xcarchive/Products/Applications/Lumen.app
          test -d "$APP"
          # A123: the build says which run and commit it is (shown in Om appen and at the end of Inställningar).
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "${GITHUB_RUN_ID}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LumenGitSHA' "$APP/Info.plist")" = "${GITHUB_SHA::7}"
          echo "::group::Bundle contents"; ls -la "$APP" "$APP/PlugIns"; echo "::endgroup::"
          # The repo declares no entitlements (D70); an unsigned build embeds none. Sideloadly adds its own when it signs.
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "<key>"; then
            echo "::warning::Unexpected entitlements in the unsigned app"
          fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Lumen-unsigned.ipa Payload)
          ls -la Lumen-unsigned.ipa
          {
            echo "### Lumen-unsigned.ipa"
            echo "Commit \`${GITHUB_SHA::7}\`, körning ${GITHUB_RUN_ID} (står i Om appen), $(du -h Lumen-unsigned.ipa | cut -f1). Download it under **Artifacts** below (a .zip with the .ipa inside); install with Sideloadly, see docs/INSTALL-SIDELOADLY.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lumen-unsigned.ipa (D70, for Sideloadly)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v5
        with:
          name: Lumen-unsigned
          path: Lumen-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload generated project (for the device session, D14)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Lumen.xcodeproj
          path: Lumen.xcodeproj
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: build-logs
          if-no-files-found: ignore
