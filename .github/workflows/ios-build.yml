name: iOS build

on:
  push:
    # Docs-, backend-, site- and QA-script-only pushes (Architect/Deangelo/Kevin/Kelly/Oscar) must not trigger or cancel an iOS build.
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "prompts/**"
      - "testdata/**"
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "AppTests/**"
      - ".github/workflows/apptest-*.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "prompts/**"
      - "testdata/**"
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "AppTests/**"
      - ".github/workflows/apptest-*.yml"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (iOS 26) + unit tests
    # Phase 1a 3.1: macOS 26 image with Xcode 26.x (actions/runner-images "macos-26").
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 and print toolchain
        run: |
          set -euo pipefail
          # Newest Xcode 26.x present on the image (path taken from the image, not guessed).
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "::group::sw_vers"; sw_vers; echo "::endgroup::"
          echo "::group::xcodebuild -version"; xcodebuild -version; echo "::endgroup::"
          echo "::group::swift --version"; swift --version; echo "::endgroup::"
          echo "::group::xcodebuild -showsdks"; xcodebuild -showsdks; echo "::endgroup::"

      - name: API-name check against the iOS SDK (replaces the local header check)
        run: bash tools/ci/check-sdk-symbols.sh

      - name: Dump Speech (SpeechAnalyzer) API from the SDK (reading aid, item 2)
        run: bash tools/ci/dump-speech-api.sh

      - name: Install XcodeGen and generate project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcodegen generate
          ls -la Lumen.xcodeproj

      - name: Scoring package tests (macOS host, swift test)
        run: |
          set -euo pipefail
          mkdir -p build-logs
          swift test --package-path Packages/LumenScoring 2>&1 | tee build-logs/scoring-tests.log

      - name: Build app for iOS device (unsigned; warnings are errors in our targets via project.yml)
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-logs/xcodebuild-build.log | xcbeautify --renderer github-actions
          # D78: FluidAudio's TTS data is GPL-3.0 / CC-BY-SA. LumenVAD switches those traits off; prove nothing slipped in.
          APP="DerivedData/Build/Products/Debug-iphoneos/Lumen.app"
          FOUND="$(find "$APP" \( -iname "*luxtts*" -o -iname "*NemoTextProcessing*" -o -iname "*kokoro*" -o -iname "*lexicon*" \) || true)"
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "::error::FluidAudio TTS/Nemo resources are in the app bundle (licence rule, D78)"
            exit 1
          fi
          echo "Licence check: no FluidAudio TTS or Nemo resources in the bundle"

      - name: Pick an iOS 26 iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          echo "::group::Available simulators"; xcrun simctl list devices available; echo "::endgroup::"
          JSON="$(xcrun simctl list devices available -j)"
          # Newest iOS 26 runtime, then prefer iPhone 17 / 17 Pro / Air, else any iPhone.
          RUNTIME="$(echo "$JSON" | jq -r '.devices | keys[] | select(test("iOS-26"))' | sort -V | tail -n 1)"
          echo "Runtime: $RUNTIME"
          UDID="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" '.devices[$rt][] | select(.name | test("^iPhone 17$|^iPhone 17 Pro$|^iPhone Air$")) | .udid' | head -n 1)"
          if [ -z "$UDID" ]; then
            UDID="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" '.devices[$rt][] | select(.name | test("^iPhone")) | .udid' | head -n 1)"
          fi
          test -n "$UDID" || { echo "No iOS 26 iPhone simulator found"; exit 1; }
          NAME="$(echo "$JSON" | jq -r --arg rt "$RUNTIME" --arg id "$UDID" '.devices[$rt][] | select(.udid == $id) | .name')"
          echo "Using simulator: $NAME ($UDID) on $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Unit tests (LumenTests on iOS 26 Simulator)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath build-logs/LumenTests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-logs/xcodebuild-test.log | xcbeautify --renderer github-actions

      # D70: an unsigned .ipa the owner installs with Sideloadly (Windows, free Apple ID). Only after every step above
      # is green, and only for main or a manual run. Debug configuration: Diagnostics and the WAV export stay in.
      - name: Archive unsigned app and pack Lumen-unsigned.ipa (D70)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild archive \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lumen.xcarchive \
            -derivedDataPath DerivedData-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_DEBUG_DYLIB=NO \
            2>&1 | tee build-logs/xcodebuild-archive.log | xcbeautify --renderer github-actions
          APP=build/Lumen.xcarchive/Products/Applications/Lumen.app
          test -d "$APP"
          echo "::group::Bundle contents"; ls -la "$APP" "$APP/PlugIns"; echo "::endgroup::"
          # The repo declares no entitlements (D70); an unsigned build embeds none. Sideloadly adds its own when it signs.
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "<key>"; then
            echo "::warning::Unexpected entitlements in the unsigned app"
          fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Lumen-unsigned.ipa Payload)
          ls -la Lumen-unsigned.ipa
          {
            echo "### Lumen-unsigned.ipa"
            echo "Commit \`${GITHUB_SHA::7}\`, $(du -h Lumen-unsigned.ipa | cut -f1). Download it under **Artifacts** below (a .zip with the .ipa inside); install with Sideloadly, see docs/INSTALL-SIDELOADLY.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lumen-unsigned.ipa (D70, for Sideloadly)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v5
        with:
          name: Lumen-unsigned
          path: Lumen-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload generated project (for the device session, D14)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Lumen.xcodeproj
          path: Lumen.xcodeproj
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: build-logs
          if-no-files-found: ignore
