name: Deploy demo site

# Publishes site/ (the public demo page, D62) to GitHub Pages:
# https://aronstenlund-code.github.io/aronstenlund-airpods-ai/
# The check job always runs. The deploy job runs only when Pages is switched on with the source "GitHub Actions"
# (owner: Settings > Pages > Source: GitHub Actions). Until then the run stays green and says so in the summary.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site files
        run: |
          set -euo pipefail
          cd site
          test -f index.html || { echo "::error::site/index.html is missing"; exit 1; }
          grep -q 'const APP_NAME = "' index.html || { echo "::error::APP_NAME is missing at the top of index.html"; exit 1; }
          # Every local file the page refers to must exist (the page uses relative paths, so it works under /<repo>/).
          missing=0
          while IFS= read -r ref; do
            case "$ref" in
              http:*|https:*|data:*|mailto:*|\#*) continue ;;
              /*) echo "::error::Absolute path $ref breaks under the project path; use a relative path"; missing=1; continue ;;
            esac
            [ -e "$ref" ] || { echo "::error::index.html refers to $ref, which is not in site/"; missing=1; }
          done < <(grep -oE '(src|href)="[^"]+"' index.html | sed -E 's/^(src|href)="//; s/"$//')
          [ "$missing" -eq 0 ]
          # No secrets: only the publishable key may appear.
          if grep -rEn 'sb_secret_|service_role|sk-ant-|xi-api-key|SUPABASE_SERVICE' . ; then
            echo "::error::Something that looks like a secret is in site/"; exit 1
          fi
          size=$(du -sk . | cut -f1)
          echo "site/ is ${size} kB"
          [ "$size" -lt 2048 ] || { echo "::error::site/ is larger than 2 MB"; exit 1; }

      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is on (source: GitHub Actions). Deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not on with the source 'GitHub Actions' (API answered $code). The site was checked but not published."
            echo "GitHub Pages is not switched on yet (API answered $code). The site files were checked; nothing was published. Owner: Settings > Pages > Source: GitHub Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
