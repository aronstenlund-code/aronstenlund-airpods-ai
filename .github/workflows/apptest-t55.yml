name: Apptest T55 (granskarens väg)

# Toby (moln), T55 (D238): granskarens väg från ny installation i T36:s klass (LUMEN_T36_REVIEW). Fake audio (D180), Debug-bygge med testkrokar.
# x-earmind-test through LUMEN_TEST_HEADER). The runner's network services are turned off for a few minutes while the
# test plays (watchdog 9 min). Makes one test exam and removes it again. Manual, and on Toby's branch when the test
# changes. Simulator only: never a device test.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Screens/SayFlowTests.swift"
      - "scripts/apptest/t55.sh"
      - ".github/workflows/apptest-t55.yml"

concurrency:
  group: apptest-t55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t55:
    name: T55 (Simulator, fake audio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: T55
        run: |
          bash scripts/apptest/t55.sh
          STATUS=$?
          cat apptest-out/t55/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-t55
          path: |
            apptest-out/t55
            !apptest-out/t55/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
