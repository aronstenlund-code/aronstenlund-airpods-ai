name: Apptest screens (T3)

# Toby's screen tour: every screen in the Simulator in light, dark, the largest text size, on a small iPhone and with
# the microphone denied. Screenshots + index.html as an artifact. Simulator only: never a verification on a device.
on:
  push:
    # toby/**: Toby iterates on his own branch, so his pushes never cancel the iOS build on main.
    branches: [main, "toby/**"]
    paths:
      - "Lumen/**"
      - "Shared/**"
      - "project.yml"
      - "AppTests/E2E/**"
      - "scripts/apptest/screens*"
      - ".github/workflows/apptest-screens.yml"
  schedule:
    - cron: "30 2 * * *" # nightly, 03:30 Swedish winter time
  workflow_dispatch:
    inputs:
      configs:
        description: "Configs to run, space-separated (empty = all), e.g. 'pro-light liten-dark'"
        required: false
        default: ""

concurrency:
  group: apptest-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: Screen tour (Simulator)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "::group::Device types"; xcrun simctl list devicetypes; echo "::endgroup::"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Screen tour
        env:
          CONFIGS: ${{ github.event.inputs.configs }}
        run: |
          # shellcheck disable=SC2086
          bash scripts/apptest/screens.sh $CONFIGS
          STATUS=$?
          cat apptest-out/screens/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-screens
          path: |
            apptest-out/screens
            !apptest-out/screens/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-screens-xcresult
          path: apptest-out/screens/logs/*.xcresult
          retention-days: 5
          if-no-files-found: ignore
