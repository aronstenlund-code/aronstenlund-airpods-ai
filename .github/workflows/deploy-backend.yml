name: Deploy backend

# Deploys the Edge Functions in backend/supabase/functions to the Lumen project (xjczbzfkmbjdebwlccki) ONLY.
# Runs the backend unit tests first; nothing is deployed if a test fails.
# Needs one repo secret entered by the owner: SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
# Token: scoped to project Lumen, Edge Functions read-write + Project Settings read.
# Without the secret the job stops with a clear message. Migrations are NOT run here (agents apply them via MCP).
on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_REF: xjczbzfkmbjdebwlccki

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is missing. Owner: GitHub repo > Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Backend unit tests
        working-directory: backend
        run: deno task test
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # pinned 2026-11-08: "latest" needs the GitHub API, which failed several times today
      - name: Deploy functions
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for f in answer tts stt-token voices feedback shared-history memory study-cards study-profile exam study-plan provlage-eval qa-log real-users-admin my-answers logo-vote; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --yes
          done
          # These do their own auth (service key / public endpoint with caps), as documented in backend/README.md.
          for f in usage-stats feedback-admin waitlist voice-lab connect debug-audio; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --yes --no-verify-jwt
          done
          # Retired lab functions: 410 stubs that do nothing (no keys, no model calls).
          for f in evallab anthtest; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --yes --no-verify-jwt
          done
      - name: Smoke test
        run: |
          U=https://$PROJECT_REF.supabase.co
          K=sb_publishable_UNDoMfEur7nwt4qH8RRanQ_pVJCrGy8
          T=$(curl -s -X POST "$U/auth/v1/signup" -H "apikey: $K" -H "content-type: application/json" -d '{}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$U/functions/v1/answer" -H "apikey: $K" -H "authorization: Bearer $T" -H "content-type: application/json" \
            -d '{"fragment":"hej","mode":"auto","language":"sv","persona":"social","social":{"style":"flirt"},"context":{"transcript":"Hej"}}')
          echo "flirt without adult_confirmed -> $code (expected 403)"
          [ "$code" = "403" ]
          for f in evallab anthtest; do
            g=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$U/functions/v1/$f" -H "content-type: application/json" -d '{}')
            echo "$f -> $g (expected 410)"
            [ "$g" = "410" ]
          done

  # K4.1: every deploy that touches the answer code is checked against 21 cases of the D87 bank (every tenth case,
  # Sonnet answers as in the app, Sonnet grades), and the result goes to the commit as a comment, so a regression is
  # seen at once. A newer push cancels a running check; "[skip eval]" in the commit message skips it. ~0.3 USD a run.
  regress:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip eval]') }}
    permissions:
      contents: write # commit comment with the built-in GITHUB_TOKEN
    concurrency:
      group: answer-regress
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did the answer code change?
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^backend/supabase/functions/(answer|_shared|provlage-eval)/'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "no answer change: no regression check"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == '1'
        with:
          python-version: "3.12"
      - name: D87 sample (21 cases)
        if: steps.changed.outputs.run == '1'
        continue-on-error: true
        run: python3 scripts/provlage-eval.py --model sonnet --judge sonnet --workers 4 --every 10 --users 3 --tag regress --out /tmp/regress
      # Standing round 3: the per-case rows, so a drop can be checked case by case (invented test bank, no user text)
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.run == '1'
        with:
          name: answer-regress
          path: /tmp/regress
          retention-days: 14
          if-no-files-found: ignore
      - name: Comment on the commit
        if: steps.changed.outputs.run == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/regress-comment.py /tmp/regress "${{ github.repository }}" "${{ github.sha }}"
