name: Apptest transcript (T17c, no ElevenLabs)

# Toby 1's T17c (D180): T16, T17, fynd 8 and A97 with recorded or written transcripts; Scribe off, never ElevenLabs.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch or commit whose app code to test (empty = this checkout). Tests and scripts come from main then."
        required: false
        default: ""
      sets:
        description: "Transcript sets, comma separated (all = every set, about 2 h). Default: the wake sets (fynd9, a97, fynd8, web)."
        required: false
        default: "fynd9,a97,fynd8,web"
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Transcript/**"
      - "AppTests/E2E/Audio/transcript-cases.json"
      - "scripts/apptest/transcript*"
      - ".github/workflows/apptest-transcript.yml"

concurrency:
  group: apptest-transcript-${{ github.ref }}-${{ inputs.app_ref }}
  cancel-in-progress: true

jobs:
  transcript:
    name: T17c transcripts (Simulator, live)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.app_ref || github.ref }}
          fetch-depth: 0

      # T38 (G7 guard): the app from another branch, the tests from main, so main and the branch are compared alike.
      - name: Tests from main
        if: inputs.app_ref != ''
        run: |
          set -euo pipefail
          git fetch -q origin main
          git checkout origin/main -- AppTests/E2E scripts/apptest
          echo "App from ${{ inputs.app_ref }} ($(git rev-parse --short HEAD)), tests from main ($(git rev-parse --short origin/main))"

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Transcript
        run: |
          # T38: all eight sets (405 cases against the live /answer) took more than 90 min (44019597374).
          SETS="${{ inputs.sets }}"; [ "$SETS" = "all" ] && SETS=""
          export TRANSCRIPT_SETS="$SETS"
          bash scripts/apptest/transcript.sh
          STATUS=$?
          cat apptest-out/transcript/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-transcript
          path: |
            apptest-out/transcript
            !apptest-out/transcript/logs/*.xcresult
          retention-days: 14
