name: Audio eval

# D88: speech -> Scribe -> /answer without a phone. Runs scripts/audio-eval.py against the DEPLOYED backend with an
# anonymous session and the public key (no secrets). The generated audio is uploaded as an Actions artifact
# (kept 14 days) and NEVER committed; only the text report (reports/eval/audio-*.md/.json) is committed.
# Uses ElevenLabs credits (TTS characters + Scribe minutes): start with the pilot.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: "Pilot (15 cases) instead of all 60"
        type: boolean
        default: true
      voices:
        description: "Number of voices (3-4)"
        default: "4"

permissions:
  contents: write

concurrency:
  group: audio-eval
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # K62b (D180, owner): testing never uses ElevenLabs credits. This workflow measured real ElevenLabs audio or
      # Scribe; the server now gives CI fake audio and a fake transcript, so it is off. A run that needs real output
      # requires Aron's yes in chat first, and then a session turns this step off for that one run.
      - name: Off (D180, no ElevenLabs credits for tests)
        run: |
          echo "::error::Off since 2026-11-14 (D180): testing never uses ElevenLabs credits. Ask Aron first."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy scipy websockets
      - name: Run audio eval
        run: python3 scripts/audio-eval.py ${{ inputs.pilot && '--pilot' || '' }} --voices "${{ inputs.voices }}" --audio-dir audio-out
      - name: Upload audio (artifact, never git)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-eval-${{ github.run_id }}
          path: audio-out
          retention-days: 14
      - name: Commit report
        run: |
          git config user.name "lumen-eval"
          git config user.email "lumen-eval@users.noreply.github.com"
          git add reports/eval/audio-*
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Audio eval $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
