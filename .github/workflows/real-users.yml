name: Real users (weekly)

# K22 + K24: questions real users chose to share (D57 opt-in, shared_history) become CANDIDATES every week: only general
# knowledge questions (nothing with a first person, a name, a relation, a number, a sensitive topic or a crisis sign),
# grouped without a model, asked by at least two installs. The candidates are an ARTIFACT (14 days), never committed:
# a person (Oscar) reviews them, sets "approved": true and runs `python3 scripts/real_users.py --approve <file>`;
# only that writes to the repo. No model call. Needs the repo secret SUPABASE_SERVICE_ROLE_KEY (owner, only after
# Oscar has approved K24); without it the run says so and stops.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read # never writes to the repo

concurrency:
  group: real-users
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # runs answer/crisis.ts directly (type stripping)
      - name: Tests (invented data)
        run: python3 scripts/test_real_users.py
      - name: Fetch and filter (candidates only)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/real_users.py --days 7 --out /tmp/real-users
      - uses: actions/upload-artifact@v4
        with:
          name: real-user-candidates
          path: /tmp/real-users/*.json
          retention-days: 14
          if-no-files-found: ignore
