name: Real users (weekly)

# K22: questions real users chose to share (D57 opt-in, shared_history) become live-eval cases and reality-bank
# cases every week: personal data removed, sensitive rows skipped, grouped without a model, kept only when at least
# two installs asked it, removed again after 12 months. No model call, no API cost. Needs the repo secret
# SUPABASE_SERVICE_ROLE_KEY (owner); without it the run says so and stops.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-users
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (invented data)
        run: python3 scripts/test_real_users.py
      - name: Fetch, scrub, group
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/real_users.py --days 7
      - name: Commit the cases
        run: |
          git config user.name "lumen-eval"
          git config user.email "lumen-eval@users.noreply.github.com"
          git add scripts/real-user-cases.json scripts/real-user-bank.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Real users $(date -u +%F) (K22, opt-in, scrubbed)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
