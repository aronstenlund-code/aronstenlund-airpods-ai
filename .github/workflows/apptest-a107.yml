name: Apptest A107 (edit, sound at Starta prov)

# Toby (moln): A107 (D190) in the Simulator: edit before Starta prov, sound at Starta prov, edit after. Fake audio (D180).
# x-earmind-test through LUMEN_TEST_HEADER). The runner's network services are turned off for a few minutes while the
# test plays (watchdog 9 min). Makes one test exam and removes it again. Manual, and on Toby's branch when the test
# changes. Simulator only: never a device test.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Screens/A107FlowTests.swift"
      - "scripts/apptest/a107.sh"
      - ".github/workflows/apptest-a107.yml"

concurrency:
  group: apptest-a107-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a107:
    name: A107 (Simulator, fake audio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: A107
        run: |
          bash scripts/apptest/a107.sh
          STATUS=$?
          cat apptest-out/a107/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-a107
          path: |
            apptest-out/a107
            !apptest-out/a107/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
