name: Apptest publish (T19)

# Toby 1's T19: Publicera prov with two accounts (A83, K49) against the live /drill. Paid (ElevenLabs Flash, about
# 1 000 characters once), so manual, and on Toby's branch when the test changes. Simulator only.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Publish/**"
      - "scripts/apptest/publish*"
      - ".github/workflows/apptest-publish.yml"

concurrency:
  group: apptest-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: T19 publish (Simulator, live)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Publish
        run: |
          bash scripts/apptest/publish.sh
          STATUS=$?
          cat apptest-out/publish/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-publish
          path: |
            apptest-out/publish
            !apptest-out/publish/logs/*.xcresult
          retention-days: 14
