name: Apptest photo upload (T20)

# Toby 1's T20: K53 in the app, 1, 4, 10 and 30 photographed pages to questions against the live /exam, a flaky
# connection that must recover, and the error paths (never "Ingen internetanslutning" with a network). Live and paid
# (Claude Haiku for the questions only), so manual, and on Toby's branch when the test changes. Simulator only.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Upload/**"
      - "scripts/apptest/upload*"
      - ".github/workflows/apptest-upload.yml"

concurrency:
  group: apptest-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    name: T20 photo upload (Simulator, live)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Upload
        run: |
          bash scripts/apptest/upload.sh
          STATUS=$?
          cat apptest-out/upload/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-upload
          path: |
            apptest-out/upload
            !apptest-out/upload/logs/*.xcresult
          retention-days: 14
