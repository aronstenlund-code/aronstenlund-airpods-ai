name: Apptest trouble and history (T60)

# T60 (Toby): D273 (Lyssnar when something goes wrong) and D271 (Historik), fake sources and a pretend server.
# One macOS machine (D217). Simulator only: never a device test.
on:
  workflow_dispatch:
  push:
    branches: ["toby/t60*"]
    paths:
      - "AppTests/E2E/Trouble/**"
      - "scripts/apptest/t60.sh"
      - ".github/workflows/apptest-t60.yml"

permissions:
  contents: read

concurrency:
  group: apptest-t60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t58:
    name: T60 trouble and history (Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Trouble and history
        run: |
          bash scripts/apptest/t60.sh
          STATUS=$?
          cat apptest-out/t60/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-t60
          path: |
            apptest-out/t60
            !apptest-out/t60/logs/*.xcresult
