name: Apptest retest after A8 and A11 (T5)

# Toby's T5: Frågor answers and speaks every question (3 continuations after a pause), Provläge makes four turns of
# one breath, Scribe holds an exam with topics over 20 characters. Live and paid (Scribe, /answer; Apple's voice, no
# /tts), so manual, and on Toby's branch when the test changes. The long run (part 4) is apptest-long.yml.
# Simulator only: never a device test. D120: Scribe is open for the whole set, so only the sets named in `sets` run
# (default fragor,block, the two A21 changed; keyterm held in T5).
on:
  workflow_dispatch:
    inputs:
      sets:
        description: "Sets to run (fragor, block, keyterm), comma separated; empty = all"
        default: "fragor,block"
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Retest/**"
      - "AppTests/E2E/Audio/retest.tsv"
      - "scripts/apptest/retest*"
      - ".github/workflows/apptest-retest.yml"

concurrency:
  group: apptest-retest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retest:
    name: T5 retest (Simulator, live)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # T17c (Toby 1, D180, owner): testing never uses ElevenLabs credits. This test listens through Scribe, so it is
      # off; the listening is tested with recorded transcripts in apptest-transcript.yml. A run that needs Scribe
      # requires Aron's yes in chat first, and then a session turns this step off for that one run.
      - name: Off (D180, no ElevenLabs credits for tests)
        run: |
          echo "::error::Off since 2026-11-14 (D180): testing never uses ElevenLabs credits. Use apptest-transcript.yml, or ask Aron first."
          exit 1
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Retest
        env:
          RETEST_SETS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sets || '' }}
        run: |
          # Toby's branch pushes run the sets in scripts/apptest/retest-branch-sets (T15: vantan), else fragor,block.
          if [ -z "$RETEST_SETS" ]; then
            RETEST_SETS="$(tr -d ' \n' < scripts/apptest/retest-branch-sets 2>/dev/null || true)"
            export RETEST_SETS="${RETEST_SETS:-fragor,block}"
          fi
          echo "Sets: $RETEST_SETS"
          bash scripts/apptest/retest.sh
          STATUS=$?
          cat apptest-out/retest/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-retest
          path: |
            apptest-out/retest
            !apptest-out/retest/audio/*.wav
            !apptest-out/retest/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
