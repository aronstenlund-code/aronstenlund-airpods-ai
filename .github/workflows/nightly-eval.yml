name: Nightly live eval

# Runs scripts/live-eval.py against the DEPLOYED backend with an anonymous Supabase session and the PUBLIC
# publishable key (both public by design: no secrets in this repo or in this workflow). The report is committed
# to reports/eval/ (docs-only path: it does not trigger the iOS build).
on:
  schedule:
    - cron: "17 2 * * *" # every night 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write # push the report with the built-in GITHUB_TOKEN

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests of the checks
        run: python3 -I scripts/test_live_eval.py
      - name: Run live eval
        run: python3 scripts/live-eval.py
      # D87: the Provläge test bank (179 spoken cases), graded by Claude Sonnet 5.5 against the rubric; the main
      # measure is the share where the first answer is enough (target >= 90 %). Model = what Provläge runs on.
      - name: Provläge test bank
        continue-on-error: true
        # K2 (2026-11-09): Provläge runs on Sonnet; every third case keeps the night at about the old cost (~0.85 USD)
        run: python3 scripts/provlage-eval.py --model "${PROVLAGE_MODEL:-sonnet}" --judge sonnet --workers 6 --every 3
        env:
          PROVLAGE_MODEL: sonnet
      # K5: the demo's answers are the first impression: 10 demo questions graded for correctness and Swedish
      - name: Demo language
        continue-on-error: true
        run: python3 scripts/k5-demo-language.py --tokens /tmp/demo-tokens.json --tag nightly
      - name: Commit report
        run: |
          git config user.name "lumen-eval"
          git config user.email "lumen-eval@users.noreply.github.com"
          git add reports/eval
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Nightly live eval $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
