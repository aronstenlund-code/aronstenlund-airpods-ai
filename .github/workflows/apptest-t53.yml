name: Apptest T53 (tillgänglighet AX5)

# Toby (moln), T53 (A148, Kelly Ke79): T36:s klass med största texten (AX5) och bara tillgänglighetsdelarna. Fake audio (D180).
# x-earmind-test through LUMEN_TEST_HEADER). The runner's network services are turned off for a few minutes while the
# test plays (watchdog 9 min). Makes one test exam and removes it again. Manual, and on Toby's branch when the test
# changes. Simulator only: never a device test.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator (T55 (2): iPhone 17 Pro or iPhone SE (3rd generation))"
        required: false
        default: "iPhone 17 Pro"
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Screens/SayFlowTests.swift"
      - "scripts/apptest/t53.sh"
      - ".github/workflows/apptest-t53.yml"

concurrency:
  group: apptest-t53-${{ github.ref }}-${{ inputs.device || 'iPhone 17 Pro' }}
  cancel-in-progress: true

jobs:
  t53:
    name: T53 (Simulator, AX5, fake audio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: T53
        env:
          A11Y_DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}
        run: |
          bash scripts/apptest/t53.sh
          STATUS=$?
          cat apptest-out/t53/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-t53-${{ inputs.device || 'iPhone 17 Pro' }}
          path: |
            apptest-out/t53
            !apptest-out/t53/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
