name: Apptest offline (T27)

# Toby (moln)'s T27: an exam played without a network (A103, D186) in the Simulator, fake audio only (D180:
# x-earmind-test through LUMEN_TEST_HEADER). The runner's network services are turned off for a few minutes while the
# test plays (watchdog 9 min). Makes one test exam and removes it again. Manual, and on Toby's branch when the test
# changes. Simulator only: never a device test.
on:
  workflow_dispatch:
  push:
    branches: ["toby/**"]
    paths:
      - "AppTests/E2E/Screens/OfflineFlowTests.swift"
      - "scripts/apptest/offline.sh"
      - ".github/workflows/apptest-offline.yml"

concurrency:
  group: apptest-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: T27 offline (Simulator, fake audio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Offline
        run: |
          bash scripts/apptest/offline.sh
          STATUS=$?
          cat apptest-out/offline/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apptest-offline
          path: |
            apptest-out/offline
            !apptest-out/offline/logs/*.xcresult
          retention-days: 14
          if-no-files-found: warn
