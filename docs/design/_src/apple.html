<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Ke53 Apple-stil</title>
<!-- Kelly, Ke53 (D160), 2026-11-13. "Efter"-skisser i iOS-stil: systemets listor, blad, knappar och färger.
     Typsnittet här är datorns systemtypsnitt (på Windows Segoe UI); i appen är det SF Pro med Dynamic Type.
     Rendera: node docs/design/_src/apple-render.js  → docs/design/bilder/apple/<id>.png (ljust | mörkt). -->
<style>
  /* iOS semantiska färger (UIKit), ljust och mörkt. Accent = appens AccentColor. */
  .light { --bg:#FFFFFF; --gbg:#F2F2F7; --cell:#FFFFFF; --label:#000000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
           --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.16); --tint:#2346C8; --ontint:#FFFFFF;
           --tintsoft:rgba(35,70,200,.12); --red:#FF3B30; --green:#34C759; --bar:rgba(249,249,249,.94); --stage:#E5E5EA; }
  .dark  { --bg:#000000; --gbg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
           --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --tint:#7F9BFF; --ontint:#0B1230;
           --tintsoft:rgba(127,155,255,.18); --red:#FF453A; --green:#30D158; --bar:rgba(22,22,24,.94); --stage:#1A1A1C; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif; background: #ccc; -webkit-font-smoothing: antialiased; }
  .pair { display: flex; width: 900px; }
  .side { flex: 1; background: var(--stage); color: var(--label); padding: 24px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .tag { font-weight: 700; font-size: 16px; color: var(--tint); }
  .cap { font-size: 13px; color: var(--sec); max-width: 390px; text-align: center; line-height: 1.38; }
  .phone { width: 375px; height: 812px; border-radius: 40px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .phone.g { background: var(--gbg); }
  .status { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 6px 32px 0; font-weight: 600; font-size: 16px; flex: none; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex: none; font-size: 17px; }
  .nav .t { font-weight: 600; } .nav a { color: var(--tint); display: flex; align-items: center; gap: 2px; }
  .nav a.b { font-weight: 600; }
  .lt { font-size: 34px; font-weight: 700; letter-spacing: .01em; padding: 2px 16px 8px; flex: none; }
  .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .sh { font-size: 13px; color: var(--sec); text-transform: uppercase; padding: 18px 32px 7px; }
  .sh.big { text-transform: none; font-size: 20px; font-weight: 700; color: var(--label); padding: 20px 20px 8px; }
  .sf { font-size: 13px; color: var(--sec); padding: 7px 32px 0; line-height: 1.35; }
  .sec { margin: 0 16px; background: var(--cell); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; position: relative; font-size: 17px; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); border-top: .5px solid var(--sep); }
  .row.ic { --inset: 60px; }
  .row .v { margin-left: auto; color: var(--sec); display: flex; align-items: center; gap: 6px; }
  .row .sub { font-size: 15px; color: var(--sec); margin-top: 1px; }
  .chev { width: 8px; height: 13px; flex: none; }
  .sym { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
  .sym svg, .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tintc { color: var(--tint); }
  .btnp { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; background: var(--tint); color: var(--ontint); font-size: 17px; font-weight: 600; }
  .btnp.dis { background: var(--fill); color: var(--ter); }
  .btns { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 25px; background: var(--fill); color: var(--tint); font-size: 17px; font-weight: 600; }
  .btnt { color: var(--tint); font-size: 17px; text-align: center; padding: 6px; }
  .bottom { margin-top: auto; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 8px; background: var(--bar); border-top: .5px solid var(--sep); }
  .g .bottom { background: color-mix(in srgb, var(--gbg) 94%, transparent); }
  .note { font-size: 13px; color: var(--sec); text-align: center; }
  .cu { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px 60px; gap: 8px; }
  .cu .big { width: 64px; height: 64px; color: var(--sec); }
  .cu h2 { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .cu p { font-size: 15px; color: var(--sec); line-height: 1.35; }
  .tb { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 34px; font-size: 17px; color: var(--tint); background: var(--bar); border-top: .5px solid var(--sep); }
  .tb span { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; width: 100%; }
  .seg span { flex: 1; text-align: center; font-size: 13px; font-weight: 500; padding: 6px 0; border-radius: 7px; }
  .seg .on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12); font-weight: 600; }
  .dark .seg .on { background: #636366; }
  .stepper { display: flex; background: var(--fill); border-radius: 8px; }
  .stepper span { width: 46px; height: 32px; display: grid; place-items: center; font-size: 22px; color: var(--label); }
  .stepper span + span { border-left: .5px solid var(--sep); }
  .thumbs { display: flex; gap: 8px; padding: 12px 16px; }
  .th { width: 46px; height: 60px; border-radius: 6px; background: #EFEBE2; border: .5px solid var(--sep); }
  .dark .th { background: #3A3A3C; }
  .num { color: var(--sec); width: 18px; font-variant-numeric: tabular-nums; font-size: 15px; }
  .q .t { font-weight: 600; } .q .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .tbicons { display: flex; gap: 20px; color: var(--tint); }
  .player { flex: 1; display: flex; flex-direction: column; padding: 0 24px; }
  .pm { display: flex; justify-content: space-between; font-size: 15px; color: var(--sec); font-weight: 500; }
  .pbar { height: 4px; border-radius: 2px; background: var(--fill2); margin-top: 8px; } .pbar i { display: block; width: 32%; height: 100%; border-radius: 2px; background: var(--label); }
  .bq { font-size: 34px; font-weight: 700; text-align: center; line-height: 1.15; margin-top: 70px; letter-spacing: -.01em; }
  .ring { width: 96px; height: 96px; margin: 32px auto 0; position: relative; }
  .ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hintbig { text-align: center; font-size: 17px; font-weight: 600; margin-top: 26px; }
  .taps { display: flex; justify-content: center; gap: 22px; font-size: 13px; color: var(--sec); margin-top: auto; padding-bottom: 14px; }
  .end { margin: 0 24px 34px; }
  .ctl-ill { width: 132px; height: 132px; border-radius: 50%; background: var(--tintsoft); display: grid; place-items: center; margin: 40px auto 0; color: var(--tint); }
  .dots { display: flex; gap: 6px; } .dots i { width: 14px; height: 14px; border-radius: 50%; background: currentColor; }
  .check { width: 22px; height: 22px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; flex: none; }
  .ring0 { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ter); flex: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--fill2); border-top-color: var(--sec); flex: none; }
  .badge { font-size: 13px; color: var(--sec); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="back" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v10M7 12h10" stroke="var(--bar)" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
  <symbol id="playc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M9.5 7.5v9l7.5-4.5z" fill="var(--cell)"/></symbol>
  <symbol id="share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M7 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="16.5" cy="12" r="1.4" fill="currentColor"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="txt" viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></symbol>
  <symbol id="wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></symbol>
  <symbol id="school" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M10 21v-5h4v5"/></symbol>
</svg>
<div id="screens"></div>
<script>
const I = (id, cls = 'ico', st = '') => `<svg class="${cls}" style="${st}"><use href="#${id}"/></svg>`;
const chev = `<svg class="chev" style="color:var(--ter)"><use href="#chev"/></svg>`;
const status = `<div class="status"><span>9:41</span><span>●●●</span></div>`;
const back = t => `<a>${I('back', 'ico', 'width:12px;height:20px;stroke:none')}${t}</a>`;
const S = []; const add = (id, tag, cap, f) => S.push({ id, tag, cap, f });
const QS = [['Varför behövs klorofyll?', 'Klorofyll fångar ljusenergin som växten behöver.'], ['Vad bildas vid fotosyntesen?', 'Socker och syre bildas av koldioxid och vatten.'],
  ['Hur hänger fotosyntes och cellandning ihop?', 'Fotosyntesen bygger socker, cellandningen bryter ner det.'], ['Varför behöver cellen mitokondrier?', 'Där sker cellandningen som ger cellen energi.'], ['Varför släpper växter ut syre?', 'Syret blir över när vatten delas.']];

add('hem-tom', 'Hem utan prov', 'Systemets tomläge (ContentUnavailableView): en symbol, en rubrik, en mening och en knapp. Inget annat på skärmen. Fler lägen och inställningar ligger i navigationsraden.',
  () => `<div class="phone">${status}<div class="nav"><span></span><span class="tbicons">${I('gear', 'ico', 'width:22px;height:22px;stroke:none')}</span></div>
  <div class="lt">Prov</div>
  <div class="cu">${I('book', 'ico big', 'stroke-width:1.5;width:64px;height:64px')}<h2>Kom förberedd till provet</h2><p>Fota ditt material. EarMind gör frågor och svar och läser upp dem i dina AirPods.</p>
  <div class="btnp" style="width:220px;margin-top:14px">Nytt prov</div><div class="btnt" style="font-size:15px">Hitta prov från din skola</div></div>
  <div class="tb" style="justify-content:center;color:var(--sec);font-size:15px"><span style="font-weight:500">Fler lägen · Beta</span></div></div>`);

add('hem', 'Hem med prov', 'En lista, som Podcaster. Överst nästa prov med den enda fyllda knappen. Andra prov som rader med ▶. Nytt prov nere till vänster med text, som Påminnelser. Ingen flamma, inga tips och inga kort i kort.',
  () => `<div class="phone g">${status}<div class="nav"><span></span><span class="tbicons">${I('gear', 'ico', 'width:22px;height:22px;stroke:none')}</span></div>
  <div class="lt">Prov</div><div class="content">
  <div class="sec" style="padding:14px 16px 16px"><div class="badge">Nästa prov · om 5 dagar</div><div style="font-size:22px;font-weight:700;margin-top:2px">Biologiprovet</div>
    <div class="sub" style="font-size:15px;color:var(--sec);margin-top:2px">5 frågor · cirka 1 min per varv</div>
    <div class="btnp" style="margin-top:14px">${I('play', 'ico', 'width:16px;height:16px;stroke:none')}Starta prov</div></div>
  <div class="sh">Andra prov</div>
  <div class="sec"><div class="row"><div><div>Historiaprovet</div><div class="sub">2 frågor · ljud klart</div></div><span class="v tintc">${I('playc', 'ico', 'width:30px;height:30px;stroke:none')}</span></div>
    <div class="row"><div><div>Prov från din skola</div><div class="sub">3 nya</div></div><span class="v">${chev}</span></div></div>
  <div class="sh">Fler lägen</div>
  <div class="sec"><div class="row"><div>Lyssnande lägen<div class="sub">Beta · använder mikrofonen</div></div><span class="v">${chev}</span></div></div>
  </div><div class="tb"><span>${I('plus', 'ico', 'width:24px;height:24px;stroke:none')}Nytt prov</span><span></span></div></div>`);

add('nytt', 'Nytt prov (Form)', 'Ett vanligt formulär i ett blad. Materialet som rader med symbol, inte ett rutnät av kort. Antal frågor med systemets Stepper och årskursen som en meny (A88, Hoppa över finns i menyn). Inget val av svarslängd (D162). Skapa frågor står alltid synlig nederst och säger varför den är grå.',
  () => `<div class="phone g">${status}<div class="nav"><a>Avbryt</a><span class="t">Nytt prov</span><span style="width:50px"></span></div>
  <div class="content" style="padding-top:8px">
  <div class="sec"><div class="row" style="color:var(--ter)">Provets namn</div></div>
  <div class="sh">Material</div>
  <div class="sec"><div class="row ic"><span class="sym" style="background:#2346C8">${I('cam')}</span><span class="tintc">Fota sidor</span></div>
    <div class="row ic"><span class="sym" style="background:#34C759">${I('photo')}</span><span class="tintc">Välj bilder</span></div>
    <div class="row ic"><span class="sym" style="background:#FF9500">${I('txt')}</span><span class="tintc">Skriv text</span></div>
    <div class="row ic"><span class="sym" style="background:#8E8E93">${I('doc')}</span><span class="tintc">Lägg till dokument</span></div></div>
  <div class="sf">Fotona och dokumenten sparas inte.</div>
  <div class="sh">Frågor</div>
  <div class="sec"><div class="row">Antal frågor<span class="v" style="gap:12px;color:var(--label)">20<span class="stepper"><span>−</span><span>+</span></span></span></div>
    <div class="row">Vilken årskurs?<span class="v" style="color:var(--label)">åk 9 ${chev}</span></div></div>
  <div class="sf">Varje fråga får ett kort och ett långt svar. Hoppa över årskursen om du vill.</div>
  </div><div class="bottom"><div class="btnp dis">Skapa frågor</div><div class="note">Lägg till minst en sida, bild eller text.</div></div></div>`);

add('fragor', 'Frågelistan', 'Stor rubrik, vanliga listrader och systemets Dela-symbol och ⋯-meny uppe till höger (Publicera prov, Ändra ordning, Ta bort). Starta prov ligger fast nederst och syns alltid, oavsett hur många frågor provet har.',
  () => `<div class="phone g">${status}<div class="nav">${back('Prov')}<span class="tbicons">${I('share', 'ico', 'width:22px;height:22px;stroke:none')}${I('more', 'ico', 'width:24px;height:24px;stroke:none')}</span></div>
  <div class="lt">Biologiprovet</div><div class="sf" style="padding:0 16px 4px">5 frågor · åk 9 · ljud klart</div>
  <div class="content">
  <div class="sh">Frågor</div>
  <div class="sec">${QS.map(([q, a], i) => `<div class="row q" style="--inset:48px;align-items:flex-start"><span class="num">${i + 1}</span><div style="min-width:0"><div class="t">${q}</div><div class="sub">${a}</div></div><span class="v" style="align-self:center">${chev}</span></div>`).join('')}
    <div class="row tintc" style="--inset:48px"><span class="num"></span>Lägg till fråga</div></div>
  <div class="sh">Sammanfattning</div>
  <div class="sec"><div class="row" style="font-size:15px">Fotosyntes, cellandning, kolets kretslopp och näringskedjor.</div></div>
  </div><div class="bottom"><div class="btnp">${I('play', 'ico', 'width:16px;height:16px;stroke:none')}Starta prov</div><div class="note">Spelas i dina AirPods. Mikrofonen används inte.</div></div></div>`);

add('kontroller', 'Styr med dina AirPods', 'Som när man parkopplar AirPods eller lägger in Face ID: en bild, en instruktion, Arons text ordagrant (A90) och en rad per steg. Inga färgade rutor. Hoppa över är en textknapp under huvudknappen, som i Apples egna introduktioner.',
  () => `<div class="phone">${status}<div class="nav"><a>Avbryt</a><span></span><span></span></div>
  <div class="content">
  <div class="ctl-ill"><span class="dots"><i></i><i></i></span></div>
  <div style="text-align:center;font-size:28px;font-weight:700;margin-top:24px">Tryck två gånger</div>
  <div style="text-align:center;font-size:17px;color:var(--sec);margin-top:6px;padding:0 40px">på skaftet, som när du byter låt.</div>
  <div style="margin:22px 32px 0;font-size:15px;line-height:1.45"><b>Medan frågan spelas:</b><br>tryck 1 gång för frågans A-svar.<br>Tryck 2 gånger för ett kort A-svar på en till två meningar.<br>Tryck 3 gånger för att pausa.<br>Tryck igen för att fortsätta.</div>
  <div class="sec" style="margin-top:18px;background:var(--gbg)">
    <div class="row"><span class="check">✓</span><div>Långt svar<div class="sub">Tryck en gång</div></div></div>
    <div class="row"><span class="spin"></span><div>Kort svar<div class="sub">Tryck två gånger</div></div></div>
    <div class="row"><span class="ring0"></span><div style="color:var(--sec)">Paus<div class="sub">Tryck tre gånger</div></div></div></div>
  </div><div class="bottom" style="background:var(--bg);border:0"><div class="btnp dis">Starta prov</div><div class="btnt">Hoppa över</div></div></div>`);

add('spelar', 'Uppspelning (första varvet)', 'Som Spelas nu i Podcaster: stor text, en tunn förloppslinje och inget mer. Första varvet står vad man ska göra rakt under nedräkningen (N1). Avsluta är en vanlig knapp, inte en egen färg.',
  () => { const c = 2 * Math.PI * 42; return `<div class="phone">${status}<div class="player">
  <div class="pm" style="margin-top:12px"><span>Fråga 2 av 5</span><span>Biologiprovet</span></div><div class="pbar"><i></i></div>
  <div class="bq">Vad bildas vid fotosyntesen?</div>
  <div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--fill2)" stroke-width="6"/><circle cx="48" cy="48" r="42" fill="none" stroke="var(--label)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c * .66} ${c}"/></svg><b>4</b></div>
  <div class="hintbig">Tryck på AirPods för svaret</div>
  <div class="taps"><span>● Långt svar</span><span>●● Kort svar</span><span>●●● Paus</span></div>

add('fs-3-kamera', '3 · Kameran', 'Systemets dokumentskanner (VNDocumentCameraViewController): den hittar sidan, beskär och tar flera i följd. Spara tar tillbaka till Nytt prov med sidorna som miniatyrer.',

  </div>${inputBar()}</div>`);

add('hjalp-svar', 'Hjälp: ett svar', 'Bubblor som i Meddelanden: din fråga till höger i accentfärgen, svaret till vänster i grått. Korta svar med stegen som en numrerad lista, och en länk när svaret pekar på en plats i appen.',

  ${me('Hur fungerar trycken?')}
  ${it('Medan frågan spelas: tryck 1 gång för frågans A-svar. Tryck 2 gånger för ett kort A-svar på en till två meningar. Tryck 3 gånger för att pausa. Tryck igen för att fortsätta.')}

add('hjalp-annat', 'Hjälp: utanför appen', 'Frågor om annat får samma korta svar (D166) och ett förslag på vad den kan i stället. Inget "Som en AI kan jag inte …".',
  () => `<div class="phone g">${status}${helpNav}<div class="content" style="padding:12px 14px 0;display:flex;flex-direction:column">

  </div><div class="bottom"><div class="btnp">Spara som prov</div><div class="btnt" style="font-size:15px">Gör om</div></div></div>`);


// ===== Ke58: Gör med ChatGPT (D169). Tre steg, inget eget AI-pynt. =====
const step = (n, t, s, btn, done = false) => `<div class="row" style="align-items:flex-start;gap:14px;padding:14px 16px">
  <span style="width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;${done ? 'background:var(--green);color:#fff' : 'background:var(--tint);color:var(--ontint)'}">${done ? '✓' : n}</span>
  <div style="flex:1;min-width:0"><div style="font-weight:600">${t}</div><div class="sub" style="line-height:1.35">${s}</div>${btn ? `<div style="margin-top:10px">${btn}</div>` : ''}</div></div>`;
const smallBtn = (t, prominent = false) => `<span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;font-size:15px;font-weight:600;${prominent ? 'background:var(--tint);color:var(--ontint)' : 'background:var(--fill);color:var(--tint)'}">${t}</span>`;

  </div><div class="bottom"><div class="btnp dis">Skapa frågor</div><div class="note">Lägg till minst en sida, bild eller text.</div></div></div>`);

add('gpt-steg', 'Gör med ChatGPT: tre steg', 'Ett blad med tre numrerade steg, en knapp i varje. Steg 3 är systemets Klistra in-knapp (PasteButton), så iOS inte frågar om urklipp. Raden längst ner säger vem som hanterar filerna.',

  <div class="content" style="padding-top:8px">
  <div class="sec"><div class="row" style="gap:12px"><span class="check" style="width:26px;height:26px">✓</span><div><div style="font-weight:600">Hittade 20 frågor med svar</div><div class="sub">Det korta svaret är första meningen i varje svar.</div></div></div></div>
  <div class="sh">Frågor</div>
  <div class="sec">${QS.slice(0, 4).map(([q, a], i) => `<div class="row q" style="--inset:48px;align-items:flex-start"><span class="num">${i + 1}</span><div style="min-width:0"><div class="t">${q}</div><div class="sub">${a}</div></div></div>`).join('')}

const root = document.getElementById('screens');
for (const s of S) {
  const side = th => `<div class="side ${th}"><div class="tag">${s.tag}</div>${s.f(th === 'dark')}<div class="cap">${s.cap}</div></div>`;
  root.insertAdjacentHTML('beforeend', `<section class="pair" id="${s.id}">${side('light')}${side('dark')}</section>`);
}
