  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/></symbol>
  <symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="qmark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.3M12 17h.01"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
  <symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="pp" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></symbol>
  <symbol id="fwd" viewBox="0 0 24 24"><path d="M3 6l9 6-9 6zM12 6l9 6-9 6z"/></symbol>
  <symbol id="school" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5M12 10.5v.01"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="rew" viewBox="0 0 24 24"><path d="M21 6l-9 6 9 6zM12 6l-9 6 9 6z"/></symbol>
</svg>
<div id="screens"></div>
<script>
const APP = 'Earmind';
const ICON = '../logo/rostning/exakt/AppIcon-1024.png';   // D139: appikonen är exakt ChatGPT-bilden D
const I = (id, cls = 'ico', style = '') => `<svg class="${cls}" style="${style}"><use href="#${id}"/></svg>`;
const status = (dark) => `<div class="status"><span>9:41</span><span>●●●</span></div>`;
const taps = n => `<span class="tap">${'<i></i>'.repeat(n)}</span>`;
const nav = (l, t, r = '', rOff = false) => `<div class="navb"><span class="l" style="display:flex;align-items:center;gap:2px">${l ? I('back', 'ico', 'width:20px;height:20px') + l : ''}</span><b>${t}</b><span class="r ${rOff ? 'off' : ''}">${r}</span></div>`;
const topBar = () => `<div class="row between"><div class="brand"><img src="${ICON}" alt="">${APP}</div>
  <div class="row"><span class="streak">3 dagar i rad</span><div class="iconbtn">${I('gear')}</div></div></div>`;

// Exempelprovet (påhittat, ingen elevtext). Korta frågor, förståelse (D144). Kort svar = första meningen i det långa (D145).
const QS = [
  ['Varför behövs klorofyll?', 'Klorofyll fångar ljusenergin som växten behöver för fotosyntesen.'],
  ['Hur bildas glukos?', 'Växten bygger glukos av koldioxid och vatten med hjälp av solljus.'],
  ['Varför släpper växter ut syre?', 'Syret blir över när vattenmolekyler delas i fotosyntesen.'],
  ['Fotosyntes jämfört med cellandning?', 'Fotosyntesen lagrar energi i glukos, cellandningen frigör den igen.'],
  ['Varför är växter producenter?', 'De tillverkar sin egen näring och blir mat åt alla andra.'],
  ['Hur påverkar ljuset fotosyntesen?', 'Mer ljus ger snabbare fotosyntes, tills något annat blir begränsande.'],
  ['Varför finns klyvöppningar?', 'De släpper in koldioxid och ut syre och vattenånga.'],
];
const LONG = ['Klorofyll fångar ljusenergin som växten behöver för fotosyntesen.',
  'Det är ett grönt färgämne i kloroplasterna, främst i bladens celler.',
  'Klorofyllet tar upp rött och blått ljus och reflekterar grönt, därför ser bladen gröna ut.',
  'Energin från ljuset används för att dela vattenmolekyler och sedan bygga glukos av koldioxid.',
  'Utan klorofyll kan växten alltså inte omvandla solenergi till kemisk energi, och då finns ingen näring för växten eller för djuren som äter den.',
  'Det är därför klorofyll är grunden för nästan alla näringskedjor.'];

const screens = [];
const S = (id, tag, cap, render, opts = {}) => screens.push({ id, tag, cap, render, opts });

// 1. Hem med prov
S('hem', 'Hem: första vägen är Starta prov',
  'Provkortet är det första man ser. Starta prov är den enda blå knappen. Lyssnande lägen ligger under Fler lägen (BETA). Ingen mikrofon på hemskärmen.',
  () => `<div class="phone">${status()}<div class="scroll">
  ${topBar()}
  <div class="card examcard">
    <div class="row between"><span class="cap13">Nästa prov</span><span class="badge">5 dagar kvar</span></div>
    <h2>Biologiprovet</h2>
    <div class="mini"><span>${I('cards')}20 frågor</span><span>${I('clock')}cirka 24 min per varv</span></div>
    <div class="btn blue big" style="margin-top:16px">${I('play')}Starta prov</div>
    <div class="row between" style="margin-top:12px;padding:0 2px"><span class="tlink">Frågor och svar</span><span class="tlink" style="display:flex;align-items:center;gap:6px">${I('share', 'ico', 'width:18px;height:18px')}Dela</span></div>
  </div>
  <div class="btn" style="flex-direction:row;gap:8px">${I('plus', 'ico', 'width:20px;height:20px')}Nytt prov</div>
  <div>
    <div class="gtitle" style="padding-left:2px">Andra prov</div>
    <div class="group" style="background:var(--surface)">
      <div class="exrow"><div><div class="t">Historia: industrialiseringen</div><div class="s">18 frågor · ljud klart</div></div><div class="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></div></div>
      <div class="exrow"><div><div class="t">Engelska glosor v. 46</div><div class="s">Ljud: 31 av 60 klara</div></div><div class="play" style="opacity:.45"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></div></div>
    </div>
  </div>
  <div class="row between" style="padding:2px 2px 0"><span class="sub" style="font-size:16px;color:var(--ink);font-weight:600">Fler lägen<span class="beta">BETA</span></span>${I('chev', 'ico', 'color:var(--mut)')}</div>
</div></div>`);

// 2. Hem tom
S('hem-tom', 'Hem utan prov',
  'Första gången: en mening om vad det är och en blå knapp. Fler lägen (BETA) ligger kvar längst ner, tyst.',
  () => `<div class="phone">${status()}<div class="scroll">
  ${topBar()}
  <div class="card"><div class="empty">
    <div class="bigic">${I('cards')}</div>
    <h2 style="font-size:24px">Kom förberedd till provet</h2>
    <div class="sub" style="font-size:16px;max-width:280px">Fota ditt material. ${APP} gör frågor och svar och läser upp dem i örat. Du styr med tryck på AirPods.</div>
    <div class="btn blue big" style="width:100%;margin-top:10px">${I('plus')}Nytt prov</div>
  </div></div>
  <div style="flex:1"></div>
  <div class="row between" style="padding:2px 2px 30px"><span class="sub" style="font-size:16px;color:var(--ink);font-weight:600">Fler lägen<span class="beta">BETA</span></span>${I('chev', 'ico', 'color:var(--mut)')}</div>
</div></div>`);

// 3. Nytt prov: material
S('material', 'Nytt prov: material',
  'Fyra sätt att lägga till, i ett rutnät. Allt som är tillagt syns som miniatyrer med ett kryss. Antal frågor och svarens längd har standardvärden (D146) och ändras här. En blå knapp.',
  () => `<div class="phone grouped">${status()}${nav('Hem', 'Nytt prov', 'Avbryt')}
  <div class="scroll" style="gap:14px;padding-top:10px">
  <div class="field" style="font-weight:600">Biologiprovet<span class="caret"></span></div>
  <div class="addgrid">
    <div class="add">${I('camera')}Fota sidor<small>Flera i följd</small></div>
    <div class="add">${I('photos')}Välj bilder<small>Ur bildbiblioteket</small></div>
    <div class="add">${I('text')}Skriv text<small>Eller klistra in</small></div>
    <div class="add">${I('doc')}Dokument<small>PDF, Word, text</small></div>
  </div>
  <div>
    <div class="flabel">Tillagt<span>9 saker</span></div>
    <div class="thumbs">
      ${'<div class="th"><b>×</b></div>'.repeat(6)}<div class="th pdf"><b>×</b>PDF</div><div class="th txt"><b>×</b>Aa</div><div class="th txt"><b>×</b>DOCX</div>
    </div>
  </div>
  <div>
    <div class="group">
      <div class="listrow">Antal frågor<span class="v" style="gap:12px"><b style="color:var(--ink);font-weight:600">20</b><span class="stepper"><span>−</span><span>+</span></span></span></div>
      <div class="listrow" style="flex-direction:column;align-items:stretch;gap:8px">Långa svar<div class="seg"><span>Kortare</span><span class="on">Normal</span><span>Längre</span></div></div>
    </div>
    <div class="gfoot">Normal är ett fullt A-svar på cirka 90 ord. Fotona och dokumenten sparas inte, bara frågorna och svaren.</div>
  </div>
  </div>
  <div class="bottom"><div class="btn blue">Skapa frågor</div></div>
</div>`);

// 4. Analyserar
S('analys', 'Earmind läser materialet',
  'Väntan med steg i stället för en snurra utan slut. Sammanfattningen visas så fort den finns; frågorna och svaren fylls på under tiden (R1: 30 och 90 s).',
  () => `<div class="phone">${status()}${nav('', 'Biologiprovet', '')}
  <div class="scroll" style="align-items:center;text-align:center;gap:20px;padding-top:80px">
    <div class="spin"></div>
    <h2 style="font-size:24px">Läser ditt material</h2>
    <div class="sub" style="max-width:270px;font-size:16px">6 foton, 1 PDF, 1 text och 1 Word-fil.</div>
    <div class="steps" style="text-align:left;margin-top:10px">
      <div class="done"><span class="d">✓</span>Läser sidorna</div>
      <div class="now"><span class="d"></span>Tar reda på ämne och årskurs</div>
      <div class="todo"><span class="d"></span>Gör frågor</div>
      <div class="todo"><span class="d"></span>Skriver svar</div>
    </div>
    <div class="sub" style="margin-top:auto;padding-bottom:40px">Du kan lämna appen. ${APP} säger till när det är klart.</div>
  </div>
</div>`);

// 5. Sammanfattning
S('sammanfattning', 'Sammanfattning: stämmer det här?',
  'Ämne, årskurs och vad provet omfattar, i ett kort. Rätta med en rad text, inget formulär. ”Ser rätt ut” är den blå knappen.',
  () => `<div class="phone grouped">${status()}${nav('Material', 'Biologiprovet', '')}
  <div class="scroll" style="padding-top:10px;gap:14px">
  <h1 style="font-size:28px">Stämmer det här?</h1>
  <div class="card">
    <div class="kv"><span>Ämne</span><span>Biologi</span></div>
    <div class="kv"><span>Årskurs</span><span>Åk 9</span></div>
    <div class="kv" style="flex-direction:column;gap:2px;border-bottom:0"><span>Provet handlar om</span>
      <div class="covers"><span>Fotosyntes</span><span>Cellandning</span><span>Klorofyll</span><span>Producenter</span><span>Näringskedjor</span><span>Klyvöppningar</span></div></div>
  </div>
  <div>
    <div class="flabel">Något fel? Skriv det</div>
    <div class="field" style="color:var(--mut)">Till exempel ”Det är åk 8” eller ”Ta inte med cellandning”</div>
  </div>
  </div>
  <div class="bottom"><div class="btn blue">Ser rätt ut</div></div>
</div>`);

// 6. Frågelista
const qRow = ([q, s], i, edit = false) => `<div class="q">${edit ? '<span class="del">−</span>' : `<span class="n">${i + 1}</span>`}
  <div style="min-width:0"><div class="t">${q}</div><div class="s">${s}</div></div>
  <div class="r">${edit ? I('grip') : I('chev', 'ico', 'width:18px;height:18px')}</div></div>`;
S('fragor', 'Frågelistan',
  'Korta frågor i fetstil, det korta svaret grått under. Ljudets förlopp syns ovanför knappen. Starta prov går direkt: ljudet görs i spelordning, så början är klar först (R1).',
  () => `<div class="phone grouped">${status()}${nav('Hem', '', 'Ändra')}
  <div class="large" style="padding-top:0">Biologiprovet</div>
  <div class="lead2" style="padding-bottom:12px">20 frågor · åk 9 · <span style="color:var(--blue);font-weight:600">Sammanfattning</span></div>
  <div class="scroll" style="padding-top:0;overflow:hidden">
    <div class="group">${QS.map((q, i) => qRow(q, i)).join('')}</div>
  </div>
  <div class="bottom">
    <div class="audiorow">${I('speaker', 'ico', 'width:18px;height:18px')}<span>Ljud: <b>36 av 40</b> klara</span><span style="margin-left:auto">Görs i spelordning</span></div>
    <div class="prog"><i style="width:90%"></i></div>
    <div class="btn blue big">${I('play')}Starta prov</div>
  </div>
</div>`);

// 7. Frågelista, ändra
S('fragor-andra', 'Frågelistan: Ändra',
  'Som iOS-listor: ta bort till vänster, dra i handtaget för att flytta. ”Lägg till fråga” står sist i listan. Klar uppe till höger.',
  () => `<div class="phone grouped">${status()}${nav('', '', 'Klar')}
  <div class="large" style="padding-top:0">Biologiprovet</div>
  <div class="lead2" style="padding-bottom:12px">Dra för att ändra ordning. Ordningen är den du hör.</div>
  <div class="scroll" style="padding-top:0;overflow:hidden">
    <div class="group">${QS.slice(0, 6).map((q, i) => qRow(q, i, true)).join('')}
      <div class="q new"><span class="n" style="color:var(--blue)">${I('plus', 'ico', 'width:20px;height:20px')}</span><div><div class="t">Lägg till fråga</div></div></div>
    </div>
  </div>
</div>`);

// 8. Redigera en fråga
S('redigera', 'Redigera en fråga',
  'Två fält, inte tre. Det korta svaret är den markerade första meningen i det långa (D145), så de kan aldrig säga emot varandra. Bara den här frågan får nytt ljud.',
  () => `<div class="phone grouped">${status()}${nav('', 'Fråga 1', 'Spara')}
  <div class="scroll" style="padding-top:10px;gap:14px">
  <div><div class="flabel">Fråga<span>4 ord</span></div><div class="field" style="font-weight:600">Varför behövs klorofyll?</div></div>
  <div><div class="flabel">Svar<span>88 ord</span></div>
    <div class="field editor" style="font-size:16px;line-height:1.45"><span class="short">${LONG[0]}</span> ${LONG.slice(1, 5).join(' ')}<span class="caret"></span></div>
    <div class="gfoot" style="display:flex;gap:8px;align-items:center;padding-top:8px"><span class="short" style="width:14px;height:14px;display:inline-block;border-radius:3px"></span>Första meningen är det korta svaret (2 tryck).</div>
  </div>
  <div class="row" style="gap:18px;padding:0 2px"><span class="tlink" style="display:flex;gap:6px;align-items:center">${I('play', 'ico', 'width:16px;height:16px')}Lyssna</span><span class="tlink" style="display:flex;gap:6px;align-items:center">${I('refresh', 'ico', 'width:16px;height:16px')}Nytt förslag</span></div>
  <div class="note" style="margin-top:auto;margin-bottom:30px">Sparar du en ändring görs nytt ljud bara för den här frågan.</div>
  </div>
</div>`);

// 9. Kontrollskärmen, mitt i testet
const ctl = (n, t, s, st, now = false) => `<div class="ctl ${now ? 'now' : ''}"><div class="tapbox">${taps(n)}</div><div><div class="t">${t}</div><div class="s">${s}</div></div>${st}</div>`;
const OK = `<span class="st ok"><span class="okdot">✓</span></span>`;
S('kontroller', 'Kontrollerna: prova innan du startar',
  'En stor sak i taget: ”Tryck två gånger nu”. Raden som testas är blå, de som fungerar får en grön bock. Ingen fråga om modell (R11). ”Hoppa över” är tyst.',
  () => `<div class="phone grouped">${status()}${nav('Prov', '', 'Hoppa över')}
  <div class="scroll" style="padding-top:4px;gap:14px">
  <h1 style="font-size:28px">Styr med dina AirPods</h1>
  <div class="pulse"><div class="core">${taps(2)}</div></div>
  <div style="text-align:center"><div style="font-size:22px;font-weight:700">Tryck två gånger nu</div><div class="sub" style="margin-top:4px">på skaftet, som när du byter låt</div></div>
  <div class="group">
    ${ctl(1, 'Långt svar', 'Hela A-svaret', OK)}
    ${ctl(2, 'Kort svar', 'Bara första meningen', `<span class="st wait">Väntar…</span>`, true)}
    ${ctl(3, 'Paus', 'Tryck igen för att fortsätta', `<span class="st idle">Sen</span>`)}
  </div>
  </div>
  <div class="bottom"><div class="btn off">Starta prov</div></div>
</div>`);

// 10. Kontrollskärmen klar
S('kontroller-klar', 'Kontrollerna: allt fungerar',
  'Tre bockar, och Starta prov blir blå. Raden om låsskärmen visar reserven en gång, utan att störa.',
  () => `<div class="phone grouped">${status()}${nav('Prov', '', '')}
  <div class="scroll" style="padding-top:4px;gap:14px">
  <h1 style="font-size:28px">Styr med dina AirPods</h1>
  <div class="pulse"><div class="core" style="background:var(--oksoft);color:var(--ok);font-size:40px;font-weight:700">✓</div></div>
  <div style="text-align:center"><div style="font-size:22px;font-weight:700">Allt fungerar</div><div class="sub" style="margin-top:4px">Under paus fortsätter vilket tryck som helst.</div></div>
  <div class="group">
    ${ctl(1, 'Långt svar', 'Hela A-svaret', OK)}
    ${ctl(2, 'Kort svar', 'Bara första meningen', OK)}

const root = document.getElementById('screens');
for (const s of screens) {
  const side = (theme) => `<div class="side ${theme}"><div class="tag">${s.tag}</div>${s.render(theme === 'dark')}<div class="cap">${s.cap}</div></div>`;
  root.insertAdjacentHTML('beforeend', `<section class="pair" id="${s.id}">${side('light')}${side('dark')}</section>`);
}
