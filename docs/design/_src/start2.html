<style>
  @font-face { font-family: "Familjen Grotesk"; src: url("../../../site/fonts/familjen-grotesk.woff2") format("woff2"); font-weight: 400 700; }
  :root, .light {
    --bg: #FFFFFF; --surface: #F4F6FA; --raised: #FFFFFF; --ink: #141A2E; --mut: #5E6779; --line: #E4E8EF;
    --blue: #2346C8; --on-blue: #FFFFFF; --soft: #EAF0FF; --stage: #E9EDF3; --dim: rgba(20,26,46,.38);
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.07);
  }
  .dark {
    --bg: #0F1218; --surface: #181C26; --raised: #1D2230; --ink: #EEF1F7; --mut: #9AA3B5; --line: #272D3B;
    --blue: #7F9BFF; --on-blue: #0E1630; --soft: #1E2A4F; --stage: #07090D; --dim: rgba(0,0,0,.55);
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Familjen Grotesk", system-ui, sans-serif; background: #ccd; }
  .pair { display: flex; width: 900px; }
  .side { flex: 1; background: var(--stage); color: var(--ink); padding: 26px 0 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tag { font-weight: 700; font-size: 17px; color: var(--blue); }
  .cap { font-size: 13.5px; color: var(--mut); max-width: 380px; text-align: center; line-height: 1.38; }
  .phone { width: 375px; height: 812px; border-radius: 38px; overflow: hidden; background: var(--bg); position: relative;
           display: flex; flex-direction: column; border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(16,24,40,.18); }
  .phone.tall { height: auto; padding-bottom: 24px; }
  .phone.se { height: 667px; border-radius: 22px; }
  .phone.grouped { background: var(--surface); }
  .dark .phone.grouped { background: var(--bg); }
  .status { height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font-weight: 600; font-size: 15px; flex: none; }
  .se .status { height: 22px; font-size: 12px; padding: 0 16px; }
  .scroll { padding: 6px 20px 0; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .ico { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--ink); }
  .brand { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 30px; height: 19px; color: var(--blue); }

  .start { display: flex; align-items: center; justify-content: center; gap: 10px; height: 72px; border-radius: 18px; background: var(--blue); color: var(--on-blue); font-weight: 700; font-size: 21px; }
  .start .ico { width: 26px; height: 26px; stroke-width: 2.2; }
  .mode { display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; font-size: 16px; font-weight: 600; margin-top: -10px; }
  .mode .m { color: var(--mut); } .mode .b { color: var(--blue); }
  .mode .ico { width: 17px; height: 17px; color: var(--mut); }

  .sub { color: var(--mut); font-size: 15px; line-height: 1.35; }

  .card { background: var(--raised); border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 18px; }
  .dark .card { border-color: transparent; }

  .badge { display: inline-flex; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--blue); font-weight: 600; font-size: 14px; }

  .dark .group { background: var(--surface); }
  .gtitle { font-size: 13px; font-weight: 600; color: var(--mut); padding: 0 16px 6px; margin-top: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .can { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .can:last-child { border-bottom: 0; }
  .can .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); color: var(--blue); display: grid; place-items: center; flex: none; }

  .navb .l, .navb .r { color: var(--blue); } .navb .r { font-weight: 600; } .navb b { font-size: 17px; }
  .ma { display: block; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ma:last-child { border-bottom: 0; }
  .ma .t { font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .ma .s { font-size: 15px; color: var(--mut); margin-top: 2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--blue); font-size: 12px; font-weight: 600; flex: none; align-self: center; }
  .examsel { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 15px; }
  .rec { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 70px; }
  .recdot { width: 14px; height: 14px; border-radius: 50%; background: #D9342B; box-shadow: 0 0 0 6px rgba(217,52,43,.18); }
  .dark .recdot { background: #FF6F61; }
  .time { font-size: 56px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .meter { display: flex; gap: 4px; align-items: center; height: 46px; color: var(--blue); }
  .meter b { width: 5px; border-radius: 3px; background: currentColor; }
  .vrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .vrow .t { font-size: 15px; font-weight: 600; } .vrow .s { font-size: 15px; color: var(--mut); line-height: 1.35; margin-top: 2px; }
  .vrow .act { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 15px; flex: none; }
  .grouped .btn:not(.blue), .grouped .examsel { background: var(--raised); }
  .dark .grouped .btn:not(.blue), .dark .grouped .examsel { background: var(--surface); }
  .toggle { width: 51px; height: 31px; border-radius: 999px; background: var(--blue); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .listrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 17px; }
  .listrow:last-child { border-bottom: 0; }
  .listrow .v { color: var(--mut); }
  .gfoot { font-size: 13px; color: var(--mut); padding: 6px 16px 0; line-height: 1.35; }
</style>

<script>
const APP = 'Lumen';     // A55 byter visningsnamnet till Earmind; väckningsordet är kvar (D128)
const I = (id, cls = 'ico') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const status = () => `<div class="status"><span>9:41</span><span>●●●</span></div>`;
const topBar = () => `<div class="row between"><div class="brand"><svg><use href="#logo"/></svg>${APP}</div>
  <div class="row"><span class="streak">3 dagar i rad</span><div class="iconbtn">${I('gear')}</div></div></div>`;

const EX = [['music', '”Lumen, kör spellistan Plugg”'], ['cal', '”Lumen, vad har jag i dag?”'], ['timer', '”Lumen, sätt en timer på 10 minuter”']];
const canDo = (ex = EX) => `<div class="well">
  <div class="h3">${APP} kan allt</div><div class="sub">Säg ”Lumen” och vad du vill.</div>
  <div class="ex">${ex.map(([i, t]) => `<div>${I(i)}<span>${t}</span></div>`).join('')}</div>
  <div class="more">Allt ${APP} kan ${I('chev', 'ico" style="width:16px;height:16px')}</div></div>`;

const examCard = () => `<div class="card">
  <div class="row between"><span class="cap13">NÄSTA PROV</span><span class="badge">5 dagar kvar</span></div>
  <h2 style="margin-top:10px">Biologiprovet</h2><div class="sub" style="margin-top:4px">lör 14 nov · åk 9 · 62 % redo</div>
  <div class="btn" style="margin-top:14px">Förhör mig<small>Startar Provläget med det här provet</small></div>
  <div class="row between" style="margin-top:12px;padding:0 2px"><span class="tlink" style="font-size:16px">Mina svar</span><span class="sub" style="display:flex;align-items:center;gap:4px">4 sparade ${I('chev', 'ico" style="width:16px;height:16px')}</span></div></div>`;

const startScreen = (mode = ['qmark', 'Standardläge']) => `<div class="phone">${status()}<div class="scroll">
  ${topBar()}
  <div class="start">${I('wave')}Starta ${APP}</div>
  <div class="mode">${I(mode[0])}<span>${mode[1]}</span><span class="m">·</span><span class="b">Byt</span></div>
  ${canDo()}
  ${examCard()}
</div></div>`;

const startSE = () => `<div class="phone se">${status()}<div class="scroll" style="gap:16px;padding-top:8px">
  ${topBar()}
  <div class="start">${I('wave')}Starta ${APP}</div>
  <div class="mode">${I('qmark')}<span>Standardläge</span><span class="m">·</span><span class="b">Byt</span></div>
  ${canDo()}
  ${examCard()}
</div></div>`;

// "Vad kan Lumen?" (A52). need: '' = inget att ställa in, annars texten; act = knappen; soon = byggs inte än.
const ROWS = {
  'Plugg': [
    ['cap', 'Förhör', '”Lumen, förhör mig på fotosyntes”', '', null],
    ['bubble', 'Svar på frågor', '”Lumen, vad betyder ambivalent?”', '', null],
    ['cards', 'Mina svar', 'Dina egna svar på provfrågor, i örat', 'I Provläget', null],
  ],
  'Vardag': [
    ['cal', 'Kalender', '”Lumen, vad har jag i dag?”', 'Tillåtet', 'ok'],
    ['bell', 'Påminnelser', '”Lumen, påminn mig om träningen kl. 18”', 'Behöver tillgång till Påminnelser', 'Tillåt'],
    ['timer', 'Timer', '”Lumen, sätt en timer på 10 minuter”', '', null],
    ['alarm', 'Larm', '”Lumen, väck mig kvart i sju”', 'Frågar första gången', null],
    ['note', 'Anteckningar', '”Lumen, spara det”', '', null],
    ['run', 'Träning', '”Lumen, ge mig ett styrkepass på 20 minuter”', '', null],
  ],
  'Musik och samtal': [
    ['music', 'Spotify', '”Lumen, kör spellistan Plugg”', 'Behöver ditt Spotify-konto', 'Koppla'],
    ['phone', 'Ring', '”Lumen, ring mamma”', 'Kommer snart', 'soon'],
  ],
  'Mer': [
    ['brief', 'Intervju', 'Färdiga svar på intervjufrågor', 'Byt läge', null],
    ['moon', 'Sömn', 'Tryck Sov på kvällen. Morgonrapport när du vaknar', '', null],
  ],
};
const canRow = ([ic, t, s, need, act]) => {
  const st = need === '' ? '<div class="st">Inget att ställa in</div>'
    : act === 'ok' ? '' : act === 'soon' ? `<div class="st">${need}</div>`
    : act ? `<div class="st need">${need}</div>` : `<div class="st">${need}</div>`;
  const right = act === 'ok' ? `<span class="ok">✓ ${need}</span>` : (act && act !== 'soon') ? `<span class="act">${act}</span>` : '';
  return `<div class="can"><div class="ic">${I(ic)}</div><div><div class="t">${t}</div><div class="s">${s}</div>${st}</div>${right}</div>`;
};
const vadkan = (groups, tall = false) => `<div class="phone grouped ${tall ? 'tall' : ''}">${status()}
  <div class="nav"><span>‹ Start</span><span></span></div>
  ${`<div class="large">Vad kan ${APP}?</div>
  <div class="lead">Som Siri, fast den förstår vad du frågar och svarar direkt i dina AirPods.</div>
  <div class="lead2">Säg ”Lumen” och sedan vad du vill. Det som behöver ställas in står på raden.</div>`}
  <div style="padding:0 16px">${groups.map(g => `<div class="gtitle">${g}</div><div class="group">${ROWS[g].map(canRow).join('')}</div>`).join('')}</div>
</div>`;

const afterFirst = () => `<div class="phone">${status()}
  <div class="scroll" style="gap:14px">
    <div class="row between"><span style="color:var(--blue);font-size:17px">‹</span><b style="font-size:17px">Standardläge</b><span style="color:var(--blue)">⋯</span></div>
    <div style="display:flex;justify-content:center;margin-top:6px"><span class="live"><i></i>Lyssnar</span></div>
    <div class="card ans"><div class="q">Vad är fotosyntes?</div><div class="a">Växter gör socker av koldioxid och vatten med hjälp av solljus, och syre bildas.</div></div>
  </div>
  <div class="dimmed"></div>
  <div class="sheet"><div class="grab"></div>
    <div class="shead"><b>${APP} kan mer än svara</b><span>Klar</span></div>
    <div style="padding:0 20px;color:var(--mut);font-size:15px;line-height:1.35">Säg ”Lumen” och vad du vill, när du vill.</div>
    <div class="ex" style="padding:6px 20px 0;gap:12px">${[['cap', '”Lumen, förhör mig på fotosyntes”'], ['cal', '”Lumen, vad har jag i dag?”'], ['timer', '”Lumen, sätt en timer på 10 minuter”']].map(([i, t]) => `<div>${I(i)}<span>${t}</span></div>`).join('')}</div>
    <div style="padding:20px 20px 0"><div class="btn blue">Visa allt ${APP} kan</div></div>
  </div>
</div>`;

const MODES = [['qmark', 'Standardläge', 'Svarar när någon frågar', true], ['cap', 'Provläge', 'För dina prov', false]];
const MORE = [['brief', 'Intervju', 'Färdiga svar på intervjufrågor'], ['people', 'Socialt', 'Ett förslag i pausen'], ['heart', 'Rizz', 'Flörtig wingman'], ['moon', 'Sov', 'Morgonrapport när du vaknar']];
const bytlage = () => `<div class="phone">${status()}
  <div class="scroll">${topBar()}<div class="start">${I('wave')}Starta ${APP}</div></div>
  <div class="dimmed"></div>
  <div class="sheet"><div class="grab"></div>
    <div class="shead"><b>Välj läge</b><span>Klar</span></div>
    ${MODES.map(([i, t, s, on]) => `<div class="mrow ${on ? 'on' : ''}">${I(i)}<div><div class="t">${t}</div><div class="s">${s}</div></div>${on ? '<span class="chk">✓</span>' : ''}</div>`).join('')}
    <div class="gtitle" style="padding:14px 20px 4px;margin:0">Fler lägen</div>
    ${MORE.map(([i, t, s]) => `<div class="mrow">${I(i)}<div><div class="t">${t}</div><div class="s">${s}</div></div></div>`).join('')}
    <div style="padding:12px 20px 0;font-size:13px;color:var(--mut)">Valet gäller Starta-knappen. Du kan också säga ”Lumen, byt till provläge”.</div>
  </div>
</div>`;

const QA = [
  ['Vad är fotosyntes?', 'Växterna tar upp koldioxid och vatten och gör socker med hjälp av solljus. Syre blir över.', false],
  ['Vad händer i mitokondrien?', 'Cellandningen: socker och syre blir energi, koldioxid och vatten.', true],
  ['Varför är klorofyll grönt?', 'Det tar upp rött och blått ljus och speglar det gröna.', false],
  ['Skillnad mellan växtcell och djurcell?', 'Växtceller har cellvägg, kloroplaster och en stor vakuol.', false],
];
const minaSvar = () => `<div class="phone grouped">${status()}
  <div class="navb"><span class="l">‹ Start</span><span></span><span class="r">Välj</span></div>
  <div class="large">Mina svar</div>
  <div style="padding:10px 16px 0"><span class="examsel">Biologiprovet ${I('chev', 'ico" style="width:14px;height:14px;transform:rotate(90deg)')}</span></div>
  <div class="lead2">När frågan kommer i Provläget säger Lumen ditt svar, ordagrant.</div>
  <div style="padding:14px 16px 0"><div class="group">${QA.map(([q, a, rec]) => `<div class="ma"><div class="t"><span>${q}</span>${rec ? '<span class="chip">Inspelat</span>' : ''}</div><div class="s">${a}</div></div>`).join('')}</div></div>
  <div style="margin-top:auto;padding:0 16px 30px;display:flex;flex-direction:column;gap:10px">
    <div class="btn blue">Skriv en fråga</div><div class="btn" style="height:54px">Spela in ett svar</div></div>
</div>`;
const minaTom = () => `<div class="phone grouped">${status()}
  <div class="navb"><span class="l">‹ Start</span><span></span><span></span></div>
  <div class="large">Mina svar</div>
  <div style="padding:10px 16px 0"><span class="examsel">Biologiprovet ${I('chev', 'ico" style="width:14px;height:14px;transform:rotate(90deg)')}</span></div>
  <div style="margin:60px 24px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center">${I('cards', 'ico" style="width:30px;height:30px')}</div>
    <div class="h3">Bestäm själv vad Lumen säger</div>
    <div class="sub" style="font-size:17px">Skriv en provfråga. Lumen föreslår ett svar, och du ändrar det tills det låter som du. När frågan kommer säger Lumen ditt svar i örat.</div>
  </div>
  <div style="margin-top:auto;padding:0 16px 30px;display:flex;flex-direction:column;gap:10px">
    <div class="btn blue">Skriv en fråga</div><div class="btn" style="height:54px">Spela in ett svar</div></div>
</div>`;
const redigera = (src = null) => `<div class="phone">${status()}
  <div class="navb"><span class="l">Avbryt</span><b>${src ? 'Nytt svar' : 'Ändra svar'}</b><span class="r">${src ? '' : '<span style="font-weight:700;margin-right:16px">⋯</span>'}Spara</span></div>
  <div class="scroll" style="gap:16px;padding-top:10px">
    <div><div class="flabel">Fråga</div><div class="field">Vad händer i mitokondrien?</div></div>
    ${src ? `<div><div class="flabel">${src}</div><div class="sugg">”… och då har vi mitokondrien, som är cellens kraftverk. Där sker cellandningen, alltså att glukos och syre blir till energi, ATP, och så blir det koldioxid och vatten över …”</div></div>`
          : `<div><div class="flabel">Lumens förslag</div><div class="sugg">I mitokondrien sker cellandningen. Glukos och syre omvandlas till energi i form av ATP, och koldioxid och vatten bildas.</div><div class="tlink" style="margin-top:8px">Använd förslaget igen</div></div>`}
    <div><div class="flabel">Ditt svar · det här säger Lumen</div><div class="field editor">Cellandningen: socker och syre blir energi, ATP, och koldioxid och vatten blir över. Mitokondrien är cellens kraftverk.<span class="caret"></span></div></div>
    <div class="sub" style="font-size:13px">Stavfel rättas när du sparar.${src ? '' : ' Tidigare versioner: ⋯ uppe till höger.'}</div>
  </div>
</div>`;
const spelaIn = () => `<div class="phone">${status()}
  <div class="navb"><span class="l">Avbryt</span><b>Spela in ett svar</b><span></span></div>
  <div style="padding:6px 20px 0"><div class="flabel">Fråga</div><div class="field">Vad händer i mitokondrien?</div></div>
  <div class="rec">
    <div class="row" style="gap:10px"><span class="recdot"></span><b style="font-size:17px">Spelar in</b></div>
    <div class="time">02:14</div>
    <div class="meter">${[10, 22, 34, 18, 40, 28, 14, 30, 44, 24, 12, 26, 36, 16, 8].map(h => `<b style="height:${h}px"></b>`).join('')}</div>
    <div class="sub" style="text-align:center;max-width:290px">Spela in när du hör ett bra svar, till exempel lärarens genomgång. Lumen gör ett kort svar av det när du trycker Klar.</div>
  </div>
  <div style="margin-top:auto;padding:0 16px 30px"><div class="btn blue">Klar</div></div>
</div>`;
const versioner = () => `<div class="phone">${status()}
  <div class="scroll"><div class="navb" style="padding:0"><span class="l">Avbryt</span><b>Ändra svar</b><span class="r"><span style="font-weight:700;margin-right:16px">⋯</span>Spara</span></div></div>
  <div class="dimmed"></div>
  <div class="sheet"><div class="grab"></div>
    <div class="shead"><b>Tidigare versioner</b><span>Klar</span></div>
    ${[['Nu', 'Cellandningen: socker och syre blir energi, ATP, och koldioxid …', ''],
       ['I går 18:02 · din', 'Socker och syre blir energi. Koldioxid och vatten blir över.', 'Återställ'],
       ['I går 17:55 · Lumens förslag', 'I mitokondrien sker cellandningen. Glukos och syre omvandlas …', 'Återställ']]
      .map(([t, x, a]) => `<div class="vrow"><div><div class="t">${t}</div><div class="s">${x}</div></div>${a ? `<span class="act">${a}</span>` : ''}</div>`).join('')}
    <div style="padding:14px 20px 0;font-size:15px;font-weight:600;color:var(--red, #D9342B)">Radera svaret</div>
  </div>
</div>`;
const instMina = () => `<div class="phone grouped">${status()}
  <div class="navb"><span class="l">‹ Inställningar</span><span></span><span></span></div>
  <div class="large" style="font-size:28px">Provläge</div>
  <div style="padding:0 16px">
    <div class="gtitle">Mina svar</div>
    <div class="group"><div class="listrow"><span>Säg mina svar</span><span class="toggle"></span></div>
      <div class="listrow"><span>Mina svar</span><span class="v">4 sparade ›</span></div></div>
    <div class="gfoot">När en fråga liknar en du har sparat säger Lumen ditt svar i stället för ett nytt. Stäng av för att alltid få Lumens svar. Dina sparade svar finns kvar.</div>
  </div>
</div>`;
const lyssnarMitt = () => `<div class="phone">${status()}
  <div class="scroll" style="gap:14px">
    <div class="row between"><span style="color:var(--blue);font-size:17px">‹</span><b style="font-size:17px">Biologiprovet</b><span style="color:var(--blue)">⋯</span></div>
    <div style="display:flex;justify-content:center;margin-top:6px"><span class="live"><i></i>Lyssnar</span></div>
    <div class="card ans"><div class="row between"><div class="q">Vad händer i mitokondrien?</div><span class="chip">Ditt svar</span></div>
      <div class="a">Cellandningen: socker och syre blir energi, ATP, och koldioxid och vatten blir över. Mitokondrien är cellens kraftverk.</div>
      <div class="tlink" style="margin-top:12px">Ändra svaret</div></div>
  </div>
</div>`;

const SCREENS = [
  ['minasvar-tom', 'Mina svar, första gången (Ke30)', minaTom, 'En mening om vad det är. Skriv en fråga är huvudknappen, Spela in ett svar sekundär.'],
  ['minasvar', 'Mina svar, per prov (Ke30)', minaSvar, 'Ett prov i taget (byt överst). Frågan och början av svaret. Inspelade svar har en bricka. Välj för att radera flera.'],
  ['minasvar-redigera', 'Lumens förslag → ditt svar (Ke30)', () => redigera(), 'Förslaget står kvar ovanför, ditt svar är det Lumen säger. Spara uppe till höger, stavfel rättas då.'],
  ['minasvar-spelain', 'Spela in ett perfekt svar (Ke30)', spelaIn, 'Synlig inspelning med röd punkt och tid. Lumen gör svaret först när du trycker Klar.'],
  ['minasvar-efterinspelning', 'Efter Klar: svaret från inspelningen (Ke30)', () => redigera('Från din inspelning · 2:14'), 'Samma redigering. Utdraget ur inspelningen står där Lumens förslag annars står.'],
  ['minasvar-versioner', 'Tidigare versioner och ångra (Ke30)', versioner, 'Under ⋯ på Ändra svar. Återställ en version, eller radera svaret (rött bara här).'],
  ['minasvar-inst', 'Stänga av Mina svar (Ke30)', instMina, 'Inställningar › Provläge. Av betyder att Lumen svarar själv; inget raderas.'],
  ['minasvar-lyssnar', 'När frågan kommer i Provläget (Ke30)', lyssnarMitt, 'Brickan Ditt svar visar att det är det sparade svaret. Ändra svaret öppnar redigeringen.'],
  ['start', 'Start (A50 + rättelser)', startScreen, 'En blå knapp, läget under med Byt. ”Lumen kan allt” med tre exempel och en väg till allt Lumen kan. Provkortet med Förhör mig som grå knapp.'],
  ['start-prov', 'Start med Provläge valt', () => startScreen(['cap', 'Provläge']), 'Bara raden under knappen ändras. Knappen säger alltid samma sak.'],
  ['start-se', 'Start på iPhone SE', startSE, 'Starta, läget och exemplen syns utan att scrolla. Provkortet börjar i underkanten.'],
  ['vadkan', 'Vad kan Lumen? (A52)', () => vadkan(['Plugg', 'Vardag']), 'Varje rad: vad det är, vad man säger, och om något behöver ställas in. Bara det som behövs får en knapp.'],
  ['vadkan-hela', 'Vad kan Lumen?, hela listan', () => vadkan(Object.keys(ROWS), true), 'Hela sidan utan att klippa. Det som inte är byggt står som ”Kommer snart”, utan knapp. Spotify får Koppla först när K36 fungerar.'],
  ['efter-forsta', 'Efter första svaret (A52)', afterFirst, 'Kommer en gång, efter första svaret. Tre exempel, en knapp till hela listan, Klar stänger.'],
  ['bytlage', 'Välj läge (Byt på Start)', bytlage, 'Standardläge och Provläge överst. Få A-svar finns inte här längre (D124, blir Mina svar i Provläget, D126). Sov ligger under Fler lägen.'],
];
document.getElementById('screens').innerHTML = SCREENS.map(([id, tag, fn, cap]) =>
  `<section class="pair" id="${id}">${['light', 'dark'].map(m => `<div class="side ${m}"><div class="tag">${tag}</div>${fn()}<div class="cap">${cap}</div></div>`).join('')}</section>`).join('');
</script>
</body>
</html>
