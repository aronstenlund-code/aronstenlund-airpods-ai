<!doctype html><meta charset="utf-8">
<!-- Kelly Ke15: delningsbilden i det nya systemet (docs/design/SYSTEM.md). Ingen handstil, inget rutpapper.
     Ordmärket utan symbol tills Aron valt logga (Ke12). Rendera från repots rot:
     chrome --headless=new --screenshot=site/og-lumen.png --window-size=1200,630 http://localhost:8790/docs/marketing/annonser/_src/og-system.html -->
<style>
@font-face{font-family:FG;src:url(familjen-grotesk.woff2);font-weight:400 700}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:FG;color:#141A2E;background:#F4F6FA;position:relative}
.word{position:absolute;left:72px;top:64px;font-weight:700;font-size:36px;color:#2346C8;letter-spacing:-.5px}
h1{position:absolute;left:72px;top:170px;width:600px;font-size:86px;line-height:1.02;letter-spacing:-2.4px;font-weight:700}
h1 span{color:#2346C8}
.sub{position:absolute;left:74px;top:400px;font-size:32px;color:#5E6779}
.pill{position:absolute;left:72px;top:478px;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:#EAF0FF;color:#2346C8;font-weight:600;font-size:26px}
.pill i{width:14px;height:14px;border-radius:50%;background:#2346C8;box-shadow:0 0 0 6px rgba(35,70,200,.18)}
.card{position:absolute;right:64px;top:34px;width:440px;height:562px;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 2px 4px rgba(16,24,40,.06),0 18px 50px rgba(16,24,40,.14)}
.card img{position:absolute;left:-10px;top:-6px;width:470px}
.rg{position:absolute;left:140px;top:268px}
.rg i{position:absolute;left:-50px;top:-50px;width:100px;height:100px;border-radius:50%;border:4px solid #2346C8}
.rg i:nth-child(1){transform:scale(.5);opacity:.9}.rg i:nth-child(2){transform:scale(.9);opacity:.5}.rg i:nth-child(3){transform:scale(1.3);opacity:.25}
</style>
<body>
<div class="word">Lumen</div>
<h1>Fråga högt. <span>Få svaret i örat.</span></h1>
<p class="sub">Telefonen stannar i fickan.</p>
<p class="pill"><i></i>Prova direkt på sidan</p>
<div class="card"><img src="../../elias/IntroElias@3x.png" alt=""><span class="rg"><i></i><i></i><i></i></span></div>
</body>
